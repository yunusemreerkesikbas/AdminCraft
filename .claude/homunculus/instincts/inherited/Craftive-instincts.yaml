# Craftive Workflow Update Docker Compose And Env For New Config

## Action

Follow the update-docker-compose-and-env-for-new-config workflow:
1. Add or update environment variable in .env.example and/or .env.local.example
2. Update docker-compose.prod.yml and docker-compose.stage.yml to include new variable or adjust settings
3. Optionally update related runtime config files (e.g., runtime-env.ts)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~2x per month
- Files: .env.example, storefront-nextjs/.env.local.example, docker-compose.prod.yml

