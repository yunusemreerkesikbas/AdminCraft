name: CI

on:
  pull_request:
    branches:
      - stage
      - master

jobs:
  backend-ci:
    name: Backend — Compile & Migration Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Compile
        run: ./mvnw -q -pl backend -DskipTests compile

      - name: Migration immutability check
        run: bash scripts/migrations/check-versioned-immutability.sh

      - name: Migration lint
        run: bash scripts/migrations/lint-migrations.sh

  backend-test:
    name: Backend — Unit Tests
    runs-on: ubuntu-latest
    needs: backend-ci
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: ./mvnw -pl backend test

  frontend-ci:
    name: Frontend — Build Check (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: storefront/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: storefront

      - name: Build (prod)
        run: npm run build -- --configuration=production
        working-directory: storefront

  # storefront-ci job removed until storefront-nextjs/ is merged to stage branch.
  # Re-add when storefront-nextjs/package-lock.json is present in the repo.
