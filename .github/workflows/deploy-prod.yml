name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch to deploy (e.g. release/release-27.02.2026)'
        required: true

env:
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          # Suggested branch naming is release/release-DD.MM.YYYY, but not enforced.
          # Strip leading "release/" when present and normalize "/" for Docker tag safety.
          RAW_TAG="${BRANCH#release/}"
          TAG="${RAW_TAG//\//-}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-backend:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-frontend:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-frontend:latest
          build-args: BUILD_ENV=prod

      - name: Build & push storefront
        uses: docker/build-push-action@v5
        with:
          context: ./storefront-nextjs
          file: docker/storefront/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-storefront:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-storefront:latest
          build-args: |
            BUILD_ENV=prod
            NEXT_OUTPUT=standalone

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production  # Requires reviewer approval in GitHub Settings

    steps:
      - name: Save current version
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          script: |
            cp /opt/craftive/prod/.last-deployed-tag \
               /opt/craftive/prod/.last-deployed-tag.prev 2>/dev/null || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/craftive/prod

            echo "${{ secrets.ENV_PROD }}" | base64 -d > .env.prod

            export APP_VERSION=${{ needs.build-and-push.outputs.tag }}
            export GHCR_ORG=${{ github.repository_owner }}

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod pull

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod up -d --remove-orphans

            echo "${APP_VERSION}" > .last-deployed-tag

      - name: Health check
        run: |
          for i in $(seq 1 10); do
            STATUS=$(curl -sf https://api.craftive.io/api/actuator/health | jq -r '.status' 2>/dev/null || echo "FAIL")
            [ "$STATUS" = "UP" ] && echo "Production deploy OK — ${{ needs.build-and-push.outputs.tag }}" && exit 0
            echo "Attempt $i/10: $STATUS — retrying in $((i * 3))s"
            sleep $((i * 3))
          done
          echo "Health check failed — triggering rollback"
          exit 1

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/craftive/prod
            PREV_TAG=$(cat .last-deployed-tag.prev 2>/dev/null || echo "")
            if [ -z "$PREV_TAG" ]; then
              echo "No previous version found for rollback"
              exit 1
            fi
            echo "Rolling back to: $PREV_TAG"
            export APP_VERSION="$PREV_TAG"
            export GHCR_ORG=${{ github.repository_owner }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod up -d --remove-orphans
            echo "Rollback complete: $PREV_TAG"

      - name: Smoke test — Admin panel
        run: |
          HTTP_CODE=$(curl -o /dev/null -w "%{http_code}" -sf https://app.craftive.io)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Admin panel smoke test failed: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Admin panel OK"
