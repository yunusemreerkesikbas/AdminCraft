name: Deploy — Production

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Release branch to deploy (e.g. release/release-27.02.2026)'
        required: true

env:
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          # Suggested branch naming is release/release-DD.MM.YYYY, but not enforced.
          # Strip leading "release/" when present and normalize "/" for Docker tag safety.
          RAW_TAG="${BRANCH#release/}"
          TAG="${RAW_TAG//\//-}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-backend:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-backend:latest

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-frontend:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-frontend:latest
          build-args: BUILD_ENV=prod

      - name: Build & push storefront
        uses: docker/build-push-action@v5
        with:
          context: ./storefront-nextjs
          file: docker/storefront/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-storefront:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-storefront:latest
          build-args: |
            BUILD_ENV=prod
            NEXT_OUTPUT=standalone

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production  # Requires reviewer approval in GitHub Settings
    permissions:
      packages: read
    env:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Sync compose files to Prod droplet
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.PROD_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          source: "docker-compose.yml,docker-compose.prod.yml"
          target: /opt/craftive/prod

      - name: Save current version
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          script: |
            cp /opt/craftive/prod/.last-deployed-tag \
               /opt/craftive/prod/.last-deployed-tag.prev 2>/dev/null || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e
            cd /opt/craftive/prod

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "${{ secrets.ENV_PROD }}" | base64 -d > .env.prod

            export APP_VERSION=${{ needs.build-and-push.outputs.tag }}
            export GHCR_ORG=${{ github.repository_owner }}
            # These vars are kept as dedicated secrets, NOT in ENV_PROD,
            # to avoid Docker Compose v5 env-file parser bug with long values (>2KB).
            export CMS_PREVIEW_SECRET="${{ secrets.CMS_PREVIEW_SECRET_PROD }}"
            export APP_ANALYTICS_GA4_SERVICE_ACCOUNT_JSON_BASE64="${{ secrets.APP_ANALYTICS_GA4_JSON_BASE64_PROD }}"

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod pull

            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod up -d --remove-orphans --force-recreate

            echo "${APP_VERSION}" > .last-deployed-tag

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            echo "Waiting for backend startup..."
            for i in $(seq 1 20); do
              CONTAINER_STATE=$(docker inspect craftive-backend --format '{{.State.Status}}' 2>/dev/null || echo "not_found")
              if [ "$CONTAINER_STATE" = "exited" ] || [ "$CONTAINER_STATE" = "not_found" ]; then
                echo "Container state: $CONTAINER_STATE — startup failed, aborting health check"
                docker logs craftive-backend --tail 50 2>&1 || true
                exit 1
              fi
              STATUS=$(docker exec craftive-backend wget -qO- http://localhost:8080/api/actuator/health 2>/dev/null | grep -o '"status":"[^"]*"' | head -1 || echo "")
              if echo "$STATUS" | grep -q '"UP"'; then
                echo "Backend healthy — $STATUS (attempt $i)"
                exit 0
              fi
              echo "Attempt $i/20: container=$CONTAINER_STATE status=$STATUS — retrying in 15s"
              sleep 15
            done
            echo "Health check failed after 20 attempts"
            docker logs craftive-backend --tail 50 2>&1 || true
            exit 1

      - name: Print backend logs on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          script: |
            echo "=== craftive-backend logs (last 100 lines) ==="
            docker logs craftive-backend --tail 100 2>&1 || echo "Container not found"
            echo "=== Container state ==="
            docker inspect craftive-backend --format 'Status: {{.State.Status}} ExitCode: {{.State.ExitCode}}' 2>/dev/null || echo "Container not found"

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/craftive/prod
            PREV_TAG=$(cat .last-deployed-tag.prev 2>/dev/null || echo "")
            if [ -z "$PREV_TAG" ]; then
              echo "No previous version found for rollback"
              exit 1
            fi
            echo "Rolling back to: $PREV_TAG"
            export APP_VERSION="$PREV_TAG"
            export GHCR_ORG=${{ github.repository_owner }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml \
              --env-file .env.prod up -d --remove-orphans
            echo "Rollback complete: $PREV_TAG"

      - name: Smoke test — Admin panel
        run: |
          HTTP_CODE=$(curl -o /dev/null -w "%{http_code}" -sf https://app.craftive.io)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Admin panel smoke test failed: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Admin panel OK"
