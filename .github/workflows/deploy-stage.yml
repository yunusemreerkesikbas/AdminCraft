name: Deploy — Stage

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy (e.g. stage or release/release-27.02.2026)'
        required: false
        default: 'stage'

env:
  REGISTRY: ghcr.io
  ORG: ${{ github.repository_owner }}

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          BRANCH="${{ github.event.inputs.branch }}"
          SHA=$(git rev-parse --short HEAD)
          if [[ "$BRANCH" == release/* ]]; then
            # release/release-27.02.2026 → release-27.02.2026
            TAG="${BRANCH#release/}"
          else
            TAG="stage-${SHA}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Build & push backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/backend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-backend:${{ steps.tag.outputs.tag }}

      - name: Build & push frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/frontend/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-frontend:${{ steps.tag.outputs.tag }}
          build-args: BUILD_ENV=stage

      - name: Build & push storefront
        uses: docker/build-push-action@v5
        with:
          context: ./storefront-nextjs
          file: docker/storefront/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.ORG }}/craftive-storefront:${{ steps.tag.outputs.tag }}
          build-args: |
            BUILD_ENV=stage
            NEXT_OUTPUT=standalone

    outputs:
      tag: ${{ steps.tag.outputs.tag }}

  deploy:
    name: Deploy to Stage
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      packages: read
    env:
      GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Save current version
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGE_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          script: |
            cp /opt/craftive/stage/.last-deployed-tag \
               /opt/craftive/stage/.last-deployed-tag.prev 2>/dev/null || true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGE_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -e
            cd /opt/craftive/stage

            echo "${GHCR_TOKEN}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            echo "${{ secrets.ENV_STAGE }}" | base64 -d > .env.stage

            export APP_VERSION=${{ needs.build-and-push.outputs.tag }}
            export GHCR_ORG=${{ github.repository_owner }}

            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stage.yml \
              --env-file .env.stage pull

            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stage.yml \
              --env-file .env.stage up -d --remove-orphans --force-recreate

            echo "${APP_VERSION}" > .last-deployed-tag

      - name: Health check
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGE_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          command_timeout: 10m
          script: |
            echo "Waiting for backend startup..."
            for i in $(seq 1 20); do
              STATUS=$(docker exec craftive-backend wget -qO- http://localhost:8080/api/actuator/health 2>/dev/null | grep -o '"status":"[^"]*"' | head -1 || echo "")
              if echo "$STATUS" | grep -q '"UP"'; then
                echo "Backend healthy — $STATUS (attempt $i)"
                exit 0
              fi
              echo "Attempt $i/20: $STATUS — retrying in 15s"
              sleep 15
            done
            echo "Health check failed after 20 attempts"
            exit 1

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.STAGE_DROPLET_IP }}
          username: deploy
          key: ${{ secrets.DROPLET_SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /opt/craftive/stage
            PREV_TAG=$(cat .last-deployed-tag.prev 2>/dev/null || echo "")
            if [ -z "$PREV_TAG" ]; then
              echo "No previous version found for rollback"
              exit 1
            fi
            echo "Rolling back to: $PREV_TAG"
            export APP_VERSION="$PREV_TAG"
            export GHCR_ORG=${{ github.repository_owner }}
            docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stage.yml \
              --env-file .env.stage up -d --remove-orphans
            echo "Rollback complete: $PREV_TAG"
