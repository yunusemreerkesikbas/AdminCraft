# Development Profile - Only overrides from base config

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        show_sql: true

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

# Email Configuration for Development
app:
  email:
    provider: console
    log-content: false      # Full HTML (verbose, for debugging templates)
    log-simplified: true    # Essential data only (recommended)
  otp:
    bypass-code: "123456"

logging:
  level:
    com.backend: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
