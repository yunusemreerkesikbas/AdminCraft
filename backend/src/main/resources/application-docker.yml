server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://mysql-db:3306/admincraft_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10
      connection-timeout: 30000
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        show_sql: false
        jdbc:
          batch_size: 50
          batch_versioned_data: true
    show-sql: false

logging:
  level:
    com.backend: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n" 