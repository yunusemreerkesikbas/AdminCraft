# Production Profile - All sensitive values from environment variables

spring:
  datasource:
    platform:
      jdbc-url: ${PLATFORM_DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
    tenant:
      host: ${DB_HOST}
      port: ${DB_PORT:3306}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        use_sql_comments: false

  flyway:
    url: ${PLATFORM_DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:https://%s.craftive.io}
  tenant:
    auto-sync-on-startup: true
  platform-domain: ${PLATFORM_DOMAIN:craftive.io}
  email:
    provider: smtp
    from-address: ${EMAIL_FROM_ADDRESS:noreply@craftive.io}
    from-name: ${EMAIL_FROM_NAME:Craftive}
  cors:
    allowed-origins:
      - https://app.craftive.io
      - https://craftive.io
      - https://www.craftive.io
    allowed-origin-patterns:
      - https://*.craftive.io
  otp:
    bypass-code:
  encryption:
    secret-key: ${RECAPTCHA_MASTER_KEY}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.backend: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
