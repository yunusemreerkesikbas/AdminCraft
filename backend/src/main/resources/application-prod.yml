spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false
        use_sql_comments: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

app:
  tenant:
    auto-sync-on-startup: true

logging:
  level:
    com.backend: INFO
    org.hibernate: WARN
    org.springframework.security: WARN
