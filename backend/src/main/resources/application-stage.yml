# Stage Profile - Requires environment variables

spring:
  datasource:
    platform:
      jdbc-url: ${PLATFORM_DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
    tenant:
      host: ${DB_HOST}
      port: ${DB_PORT:3306}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  flyway:
    url: ${PLATFORM_DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

craftive:
  storage:
    provider: s3
    s3:
      endpoint: https://fra1.digitaloceanspaces.com
      bucket: craftive-media-stage
      region: fra1
      cdn-base-url: https://s1-cdn.craftive.io
      access-key: ${SPACES_ACCESS_KEY}
      secret-key: ${SPACES_SECRET_KEY}

app:
  jwt:
    secret: ${JWT_SECRET}
  otp:
    bypass-code: ${OTP_BYPASS_CODE:}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:https://s1-%s.craftive.io}
    admin-url: ${APP_FRONTEND_ADMIN_URL:https://s1-app.craftive.io}
  tenant:
    auto-sync-on-startup: true
    trust-forwarded-host: ${TENANT_TRUST_FORWARDED_HOST:false}
  commerce:
    payment:
      callback-base-url: ${APP_COMMERCE_PAYMENT_CALLBACK_BASE_URL:https://s1-%s.craftive.io/api}
  platform-domain: ${PLATFORM_DOMAIN:s1.craftive.io}
  email:
    log-content: false
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://127.0.0.1:4200
      - http://admin.localhost:4200
      - https://s1-app.craftive.io
      - https://craftive.io
      - https://www.craftive.io
      - https://craftive-landing.pages.dev
    allowed-origin-patterns:
      - http://*.localhost:4200
      - https://s1-*.craftive.io
      - https://*.craftive-landing.pages.dev
  encryption:
    secret-key: ${RECAPTCHA_MASTER_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.backend: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
