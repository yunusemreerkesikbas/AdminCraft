# Stage Profile - Requires environment variables

spring:
  datasource:
    platform:
      jdbc-url: ${PLATFORM_DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
    tenant:
      host: ${DB_HOST}
      port: ${DB_PORT:3306}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  flyway:
    url: ${PLATFORM_DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

craftive:
  storage:
    provider: s3
    s3:
      endpoint: https://fra1.digitaloceanspaces.com
      bucket: craftive-media-stage
      region: fra1
      cdn-base-url: https://s1.media.craftive.io

app:
  jwt:
    secret: ${JWT_SECRET}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:https://s1-%s.craftive.io}
  tenant:
    auto-sync-on-startup: true
  platform-domain: ${PLATFORM_DOMAIN:s1.craftive.io}
  email:
    log-content: false
  cors:
    allowed-origins:
      - https://s1.app.craftive.io
    allowed-origin-patterns:
      - https://s1-*.craftive.io
  encryption:
    secret-key: ${RECAPTCHA_MASTER_KEY}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.backend: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
