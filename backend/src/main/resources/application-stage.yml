# Stage Profile - Requires environment variables

spring:
  datasource:
    platform:
      jdbc-url: ${PLATFORM_DB_URL}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}
    tenant:
      host: ${DB_HOST}
      port: ${DB_PORT:3306}
      username: ${DB_USERNAME}
      password: ${DB_PASSWORD}

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  flyway:
    url: ${PLATFORM_DB_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  jwt:
    secret: ${JWT_SECRET}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:https://%s.stage.admincraft.com}
  tenant:
    auto-sync-on-startup: true
  platform-domain: ${PLATFORM_DOMAIN:stage.admincraft.com}
  recaptcha:
    secret-key: ${RECAPTCHA_SECRET_KEY}
  encryption:
    secret-key: ${RECAPTCHA_MASTER_KEY}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

logging:
  level:
    com.backend: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
