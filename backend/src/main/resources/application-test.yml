spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

    tenant:
      host: localhost
      port: 3306
      username: sa
      password:
      jdbc-url-template: jdbc:h2:mem:{dbName};MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  h2:
    console:
      enabled: true

app:
  tenant:
    auto-sync-on-startup: false # Disable for tests
  cms:
    rate-limit:
      permits-per-minute: 10000.0

logging:
  level:
    com.backend: DEBUG

# Disable rate limiting for tests
resilience4j:
  ratelimiter:
    instances:
      runtimeMigration:
        limit-for-period: 1000
        limit-refresh-period: 1s
      entryFieldDefinition:
        limit-for-period: 1000
        limit-refresh-period: 1s
