server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: AdminCraft
  
  profiles:
    active: dev
  
  datasource:
    url: jdbc:mysql://localhost:3307/admincraft-db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        show_sql: true
    show-sql: true
  
  messages:
    basename: i18n/messages
    encoding: UTF-8
    cache-duration: 3600
  
  web:
    locale: tr
    locale-resolver: accept_header

logging:
  level:
    com.backend: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

---
spring:
  config:
    activate:
      on-profile: dev
  
  datasource:
    url: jdbc:mysql://localhost:3307/admincraft-db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul
    username: root
    password: 1234
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: docker
  
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql-db}:${DB_PORT:3306}/${DB_NAME:admincraft_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul
    username: ${DB_USERNAME:admincraft_user}
    password: ${DB_PASSWORD:admincraft_password}
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

---
spring:
  config:
    activate:
      on-profile: prod
  
  datasource:
    url: jdbc:mysql://localhost:3306/admincraft_prod?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    
logging:
  level:
    com.backend: INFO
    org.springframework.security: WARN
    org.hibernate: WARN

# Multi-tenant configuration
admincraft:
  tenant:
    default-schema: public
    schema-prefix: tenant_
  security:
    jwt:
      secret: ${JWT_SECRET:YourSecretKeyForJWTTokensShouldBeAtLeast256BitsLong}
      expiration: 86400000 # 24 hours
  i18n:
    default-language: TR
    supported-languages: TR,EN