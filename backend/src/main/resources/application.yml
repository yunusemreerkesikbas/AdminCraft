server:
  port: 8080
  forward-headers-strategy: framework
  servlet:
    context-path: /api

app:
  jwt:
    secret: ${JWT_SECRET:MyVerySecureJWTSecretKeyForCraftiveApplication2024WithMoreThan32Characters!}
    expiration: ${JWT_EXPIRATION:86400000}
    refreshExpiration: ${JWT_REFRESH_EXPIRATION:604800000}
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL:http://%s.localhost:4200}
    admin-url: ${APP_FRONTEND_ADMIN_URL:http://localhost:4200}
  cors:
    allowed-origins:
      - http://localhost:4200
      - http://127.0.0.1:4200
      - http://localhost:3000
      - http://127.0.0.1:3000
    allowed-origin-patterns:
      - http://*.localhost:4200
  tenant:
    auto-sync-on-startup: ${TENANT_AUTO_SYNC:false}
  platform-domain: ${PLATFORM_DOMAIN:craftive.io}
  email:
    enabled: ${EMAIL_ENABLED:true}
    provider: ${EMAIL_PROVIDER:console}
    from-address: ${EMAIL_FROM_ADDRESS:noreply@craftive.io}
    from-name: ${EMAIL_FROM_NAME:Craftive}
    log-content: ${EMAIL_LOG_CONTENT:false}
  otp:
    length: ${OTP_LENGTH:6}
    expiry-seconds: ${OTP_EXPIRY_SECONDS:300}
    max-attempts: ${OTP_MAX_ATTEMPTS:5}
    bypass-code: ${OTP_BYPASS_CODE:}
  password-reset:
    expiry-seconds: ${PASSWORD_RESET_EXPIRY_SECONDS:3600}
  email-verification:
    expiry-seconds: ${EMAIL_VERIFICATION_EXPIRY_SECONDS:86400}
  trusted-device:
    expiry-days: ${TRUSTED_DEVICE_EXPIRY_DAYS:30}
    max-devices-per-user: ${TRUSTED_DEVICE_MAX_PER_USER:5}
  recaptcha:
    verify-url: https://www.google.com/recaptcha/api/siteverify
    timeout-seconds: 5
  encryption:
    secret-key: ${RECAPTCHA_MASTER_KEY:CHANGE_THIS_TO_32_CHAR_KEY_IN_PROD}

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  application:
    name: Craftive

  datasource:
    platform:
      jdbc-url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/platform_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul&characterEncoding=UTF-8&useUnicode=true
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:1234}
      driver-class-name: com.mysql.cj.jdbc.Driver
    tenant:
      host: ${DB_HOST:localhost}
      port: ${DB_PORT:3306}
      username: ${DB_USERNAME:root}
      password: ${DB_PASSWORD:1234}
      driver-class-name: com.mysql.cj.jdbc.Driver
      jdbc-url-template: jdbc:mysql://${spring.datasource.tenant.host}:${spring.datasource.tenant.port}/{dbName}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul&characterEncoding=UTF-8&useUnicode=true

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        multiTenancy: DATABASE
        multi_tenant_connection_provider: com.backend.infrastructure.tenant.MultiTenantConnectionProvider
        tenant_identifier_resolver: com.backend.infrastructure.tenant.CurrentTenantIdentifierResolver

  flyway:
    enabled: true
    locations: classpath:db/platform
    baseline-on-migrate: true
    baseline-version: 0
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/platform_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul&characterEncoding=UTF-8&useUnicode=true
    user: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}

  messages:
    basename: i18n/messages
    encoding: UTF-8
    cache-duration: 3600

  web:
    locale: tr
    locale-resolver: accept-header

logging:
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} [Tenant:%X{tenantId}][Corr:%X{correlationId}] - %msg%n"

craftive:
  tenant:
    default-schema: public
    schema-prefix: tenant_
  i18n:
    default-language: TR
    supported-languages: TR,EN
  storage:
    provider: ${STORAGE_PROVIDER:local}
    base-path: ${STORAGE_PATH:uploads}
    temp-path: ${TEMP_PATH:temp}
    max-file-size: ${MAX_FILE_SIZE:10485760}
    allowed-mime-types: image/jpeg,image/png,image/gif,image/webp,application/pdf,video/mp4,audio/mpeg
    blocked-extensions: exe,bat,cmd,scr,js,vbs,ps1,sh
    processing:
      async-enabled: true
      thumbnail-quality: 80
      auto-generate-formats: THUMBNAIL,SMALL,MEDIUM
      supported-image-types: image/jpeg,image/png,image/gif,image/webp
    s3:
      endpoint: ${SPACES_ENDPOINT:}
      bucket: ${SPACES_BUCKET:}
      region: ${SPACES_REGION:fra1}
      access-key: ${SPACES_ACCESS_KEY:}
      secret-key: ${SPACES_SECRET_KEY:}
      cdn-base-url: ${SPACES_CDN_URL:}
      delete-local-after-migration: false

resilience4j:
  ratelimiter:
    instances:
      entryFieldDefinition:
        limit-for-period: 5
        limit-refresh-period: 60s
        timeout-duration: 0s
        allow-health-indicator-to-fail: true
      impexExecute:
        limit-for-period: 5
        limit-refresh-period: 60s
        timeout-duration: 0s
        allow-health-indicator-to-fail: true
