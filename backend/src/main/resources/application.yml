server:
  port: 8080
  servlet:
    context-path: /api

# JWT Token configuration - FOR DEVELOPMENT ONLY
# Production must use JWT_SECRET environment variable
app:
  jwt:
    secret: ${JWT_SECRET:MyVerySecureJWTSecretKeyForAdminCraftApplication2024WithMoreThan32Characters!}
    expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
    refreshExpiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds

spring:
  application:
    name: AdminCraft

  profiles:
    active: dev

  datasource:
    url: jdbc:mysql://localhost:3307/admincraft-db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        show_sql: true
    show-sql: true
    defer-datasource-initialization: false

  sql:
    init:
      mode: never
      data-locations: classpath:data.sql
      schema-locations: classpath:schema-page-builder.sql

  messages:
    basename: i18n/messages
    encoding: UTF-8
    cache-duration: 3600

  web:
    locale: tr
    locale-resolver: accept-header

logging:
  level:
    com.backend: DEBUG
    org.springframework.security: DEBUG
    org.hibernate: DEBUG
  pattern:
    console: '%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n'

---
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:mysql://localhost:3307/admincraft-db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul&characterEncoding=UTF-8&useUnicode=true
    username: root
    password: 1234

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
---
spring:
  config:
    activate:
      on-profile: seed

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  sql:
    init:
      mode: always
      data-locations: classpath:data.sql
      schema-locations: classpath:schema-page-builder.sql
---
spring:
  config:
    activate:
      on-profile: docker

  datasource:
    url: jdbc:mysql://${DB_HOST:mysql-db}:${DB_PORT:3306}/${DB_NAME:admincraft-db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul&characterEncoding=UTF-8&useUnicode=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
---
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: jdbc:mysql://localhost:3306/admincraft_prod?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul

  jpa:
    hibernate:
      ddl-auto: update # Production uses validate for safety
    show-sql: false

logging:
  level:
    com.backend: INFO
    org.springframework.security: WARN
    org.hibernate: WARN

# Multi-tenant configuration
admincraft:
  tenant:
    default-schema: public
    schema-prefix: tenant_
  i18n:
    default-language: TR
    supported-languages: TR,EN
