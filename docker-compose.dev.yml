# AdminCraft - Local Development Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up -d
#
# This configuration runs MySQL + phpMyAdmin locally.
# Backend and Frontend are run separately via IDE/CLI for hot-reload.

services:
  mysql-db:
    ports:
      - "3306:3306"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: craftive-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console → http://localhost:9001
    volumes:
      - minio_data:/data
    networks:
      - craftive-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: craftive-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: ${DB_PASSWORD}
      PMA_ARBITRARY: 1
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      UPLOAD_LIMIT: 20M
      MEMORY_LIMIT: 128M
    ports:
      - "8081:80"
    depends_on:
      - mysql-db
    networks:
      - craftive-network
