# Craftive - Production Override
# Usage:
#   Prod:  docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d --build
#   Stage: docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stage.yml --env-file .env.stage up -d --build

services:
  mysql-db:
    # No port exposure in production - internal only via Docker network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M

  backend:
    image: ghcr.io/${GHCR_ORG}/craftive-backend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: craftive-backend
    restart: unless-stopped
    depends_on:
      mysql-db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-prod}
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      RECAPTCHA_MASTER_KEY: ${RECAPTCHA_MASTER_KEY}
      PLATFORM_DB_URL: jdbc:mysql://mysql-db:3306/platform_management?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Istanbul
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL}
      PLATFORM_DOMAIN: ${PLATFORM_DOMAIN}
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME}
      SPACES_ACCESS_KEY: ${SPACES_ACCESS_KEY}
      SPACES_SECRET_KEY: ${SPACES_SECRET_KEY}
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 150s
    networks:
      - craftive-network
    labels:
      traefik.enable: "true"
      traefik.http.routers.backend.rule: "Host(`api.${DOMAIN}`)"
      traefik.http.routers.backend.entrypoints: "websecure"
      traefik.http.routers.backend.tls.certresolver: "letsencrypt"
      traefik.http.services.backend.loadbalancer.server.port: "8080"
      # Rate limiting for unauthenticated public demo-request endpoint
      traefik.http.middlewares.demo-request-ratelimit.ratelimit.average: "3"
      traefik.http.middlewares.demo-request-ratelimit.ratelimit.burst: "5"
      traefik.http.middlewares.demo-request-ratelimit.ratelimit.period: "10m"
      traefik.http.middlewares.demo-request-ratelimit.ratelimit.sourcecriterion.ipstrategy.depth: "1"
      traefik.http.routers.backend-public-demo.rule: "Host(`api.${DOMAIN}`) && PathPrefix(`/api/platform/public/demo-requests`)"
      traefik.http.routers.backend-public-demo.entrypoints: "websecure"
      traefik.http.routers.backend-public-demo.tls.certresolver: "letsencrypt"
      traefik.http.routers.backend-public-demo.priority: "10"
      traefik.http.routers.backend-public-demo.service: "backend"
      traefik.http.routers.backend-public-demo.middlewares: "demo-request-ratelimit@docker"

  frontend:
    image: ghcr.io/${GHCR_ORG}/craftive-frontend:${APP_VERSION:-latest}
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
      args:
        - BUILD_ENV=${SPRING_PROFILE:-prod}
    container_name: craftive-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - craftive-network
    labels:
      traefik.enable: "true"
      traefik.http.routers.frontend.rule: "Host(`app.${DOMAIN}`)"
      traefik.http.routers.frontend.entrypoints: "websecure"
      traefik.http.routers.frontend.tls.certresolver: "letsencrypt"
      traefik.http.services.frontend.loadbalancer.server.port: "80"
      # Redirect root domain to app subdomain
      traefik.http.routers.root-redirect.rule: "Host(`${DOMAIN}`) || Host(`www.${DOMAIN}`)"
      traefik.http.routers.root-redirect.entrypoints: "websecure"
      traefik.http.routers.root-redirect.tls.certresolver: "letsencrypt"
      traefik.http.routers.root-redirect.middlewares: "redirect-to-app"
      traefik.http.middlewares.redirect-to-app.redirectregex.regex: ".*"
      traefik.http.middlewares.redirect-to-app.redirectregex.replacement: "https://app.${DOMAIN}"
      traefik.http.middlewares.redirect-to-app.redirectregex.permanent: "true"

  storefront:
    image: ghcr.io/${GHCR_ORG}/craftive-storefront:${APP_VERSION:-latest}
    build:
      context: ./storefront-nextjs
      dockerfile: ../docker/storefront/Dockerfile
      args:
        - BUILD_ENV=${SPRING_PROFILE:-prod}
        - NEXT_OUTPUT=standalone
    container_name: craftive-storefront
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      TENANT_SUBDOMAIN: ${STOREFRONT_TENANT_SUBDOMAIN:-demo}
      TENANT_HOSTNAME: ${STOREFRONT_TENANT_HOSTNAME:-}
      NEXT_PUBLIC_CMS_API_URL: ${STOREFRONT_CMS_API_URL:-https://api.craftive.io/api}
    networks:
      - craftive-network
    labels:
      - "traefik.enable=true"
      # Demo/reference storefront shipped from this repo.
      # Tenant-specific storefronts are deployed separately via deploy-tenant-storefront.sh.
      # Matches tenant subdomains; excludes prod API and admin panel hosts.
      - "traefik.http.routers.storefront.rule=HostRegexp(`[a-z0-9-]+\\.${DOMAIN}`) && !Host(`api.${DOMAIN}`) && !Host(`app.${DOMAIN}`)"
      - "traefik.http.routers.storefront.priority=1"
      - "traefik.http.routers.storefront.entrypoints=websecure"
      - "traefik.http.routers.storefront.tls.certresolver=letsencrypt"
      - "traefik.http.services.storefront.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'

  traefik:
    image: traefik:v3.6
    container_name: craftive-traefik
    restart: unless-stopped
    command:
      - "--api.dashboard=false"
      - "--log.level=INFO"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge=true"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
    environment:
      CF_API_TOKEN: ${CF_API_TOKEN}
      CLOUDFLARE_DNS_API_TOKEN: ${CF_API_TOKEN}
      DOCKER_API_VERSION: "1.43"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik_letsencrypt:/letsencrypt
    networks:
      - craftive-network

  alloy:
    image: grafana/alloy:v1.13.2
    container_name: craftive-alloy
    restart: unless-stopped
    environment:
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_LOKI_TOKEN: ${GRAFANA_CLOUD_LOKI_TOKEN}
      LOG_ENV: ${LOG_ENV}
      LOG_HOST: ${LOG_HOST}
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--server.http.listen-addr=127.0.0.1:12345"
    volumes:
      - ./observability/alloy.river:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/craftive/logs:/host/opt-craftive-logs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12345/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - craftive-network

volumes:
  traefik_letsencrypt:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local

networks:
  craftive-network:
    external: true
