# Craftive - Stage Overrides
# Adds stage routing overrides and storefront demo container to the prod stack.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.stage.yml --env-file .env.stage up -d --build

services:
  backend:
    environment:
      SPACES_ACCESS_KEY: ${SPACES_ACCESS_KEY}
      SPACES_SECRET_KEY: ${SPACES_SECRET_KEY}
    labels:
      traefik.http.routers.backend.rule: "Host(`s1-api.${DOMAIN}`)"

  frontend:
    labels:
      traefik.http.routers.frontend.rule: "Host(`s1-app.${DOMAIN}`)"
      traefik.http.routers.root-redirect.rule: "Host(`s1.${DOMAIN}`)"
      traefik.http.middlewares.redirect-to-app.redirectregex.replacement: "https://s1-app.${DOMAIN}"

  storefront:
    image: ghcr.io/${GHCR_ORG}/craftive-storefront:${APP_VERSION:-latest}
    build:
      context: ./storefront-nextjs
      dockerfile: ../docker/storefront/Dockerfile
      args:
        - BUILD_ENV=stage
        - NEXT_OUTPUT=standalone
    container_name: craftive-storefront
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      HOSTNAME: "0.0.0.0"
      TENANT_SUBDOMAIN: ${STOREFRONT_TENANT_SUBDOMAIN:-demo}
      TENANT_HOSTNAME: ${STOREFRONT_TENANT_HOSTNAME:-}
      NEXT_PUBLIC_CMS_API_URL: ${STOREFRONT_CMS_API_URL:-https://s1-api.craftive.io/api}
    networks:
      - craftive-network
    labels:
      - "traefik.enable=true"
      # Matches stage tenant domains in s1-<tenant>.domain format; excludes stage API and admin panel hosts.
      - "traefik.http.routers.storefront.rule=HostRegexp(`s1-[a-z0-9-]+\\.${DOMAIN}`) && !Host(`s1-api.${DOMAIN}`) && !Host(`s1-app.${DOMAIN}`)"
      - "traefik.http.routers.storefront.priority=1"
      - "traefik.http.routers.storefront.entrypoints=websecure"
      - "traefik.http.routers.storefront.tls.certresolver=letsencrypt"
      - "traefik.http.services.storefront.loadbalancer.server.port=3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  alloy:
    image: grafana/alloy:v1.13.2
    container_name: craftive-alloy
    restart: unless-stopped
    environment:
      GRAFANA_CLOUD_LOKI_URL: ${GRAFANA_CLOUD_LOKI_URL}
      GRAFANA_CLOUD_LOKI_USER: ${GRAFANA_CLOUD_LOKI_USER}
      GRAFANA_CLOUD_LOKI_TOKEN: ${GRAFANA_CLOUD_LOKI_TOKEN}
      LOG_ENV: ${LOG_ENV}
      LOG_HOST: ${LOG_HOST}
    command:
      - "run"
      - "/etc/alloy/config.alloy"
      - "--server.http.listen-addr=127.0.0.1:12345"
    volumes:
      - ./observability/alloy.river:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /opt/craftive/logs:/host/opt-craftive-logs:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:12345/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    networks:
      - craftive-network
