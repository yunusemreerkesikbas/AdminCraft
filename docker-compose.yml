services:
  # MySQL Database for AdminCraft
  mysql-db:
    image: mysql:8.0
    container_name: admincraft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: admincraft-db
      TZ: Europe/Istanbul
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - admincraft-network
    command: --default-authentication-plugin=mysql_native_password

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: admincraft-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: 1234
      PMA_ARBITRARY: 1
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
    ports:
      - "8081:80"
    depends_on:
      - mysql-db
    networks:
      - admincraft-network

# Named volumes for persistent data
volumes:
  mysql_data:
    driver: local

# Network for all services
networks:
  admincraft-network:
    driver: bridge