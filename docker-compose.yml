services:
  # MySQL Database for AdminCraft
  mysql-db:
    image: mysql:8.0
    container_name: admincraft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: admincraft_db
      TZ: Europe/Istanbul
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/mysql/conf:/etc/mysql/conf.d
    networks:
      - admincraft-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Development MySQL Database (for testing)
  mysql-dev:
    image: mysql:8.0
    container_name: admincraft-mysql-dev
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: admincraft_dev
      TZ: Europe/Istanbul
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - admincraft-network
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p1234"]
      interval: 30s
      timeout: 10s
      retries: 5

  # AdminCraft Spring Boot Application
  admincraft-app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: admincraft-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: ${MYSQL_DATABASE:-admincraft_db}
      DB_USERNAME: root
      DB_PASSWORD: 1234
      SERVER_PORT: 8080
      TZ: Europe/Istanbul
    ports:
      - "8080:8080"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - admincraft-network
    volumes:
      - app_logs:/app/logs
      - media_storage:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # phpMyAdmin for database management
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:5.2
    container_name: admincraft-phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql-db
      PMA_PORT: 3306
      PMA_USER: ${MYSQL_USER:-root}
      PMA_PASSWORD: ${MYSQL_PASSWORD:-1234}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      PMA_ARBITRARY: 1
    ports:
      - "8081:80"
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - admincraft-network

  # Redis for caching (optional)
  redis:
    image: redis:7-alpine
    container_name: admincraft-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - admincraft-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redispassword}

# Named volumes for persistent data
volumes:
  mysql_data:
    driver: local
  mysql_dev_data:
    driver: local
  redis_data:
    driver: local
  app_logs:
    driver: local
  media_storage:
    driver: local

# Network for all services
networks:
  admincraft-network:
    driver: bridge