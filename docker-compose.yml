# AdminCraft - Base Docker Compose Configuration
# This file contains shared services used across all environments.
# Use with environment-specific override files:
#   - Dev:  docker compose -f docker-compose.yml -f docker-compose.dev.yml --env-file .env.dev up -d
#   - Prod: docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  mysql-db:
    image: mysql:8.0
    container_name: craftive-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: platform_management
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_unicode_ci
      TZ: ${TZ:-Europe/Istanbul}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/conf/my.cnf:/etc/mysql/conf.d/my.cnf
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - craftive-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --init-connect='SET NAMES utf8mb4'
      --skip-character-set-client-handshake
      --default-time-zone='+03:00'

volumes:
  mysql_data:
    driver: local

networks:
  craftive-network:
    driver: bridge
