<div class="bg-card flex min-w-0 flex-auto flex-col overflow-hidden sm:absolute sm:inset-0 dark:bg-transparent">
    <admin-page-header
        [title]="'admin.commerce.notificationOutbox.title' | transloco"
        [subtitle]="'admin.commerce.notificationOutbox.subtitle' | transloco"
        [showSearch]="true"
        [searchPlaceholder]="'admin.commerce.notificationOutbox.searchPlaceholder' | transloco"
        (search)="onSearchInput($event)"
        [isLoading]="store.isLoading()"
    >
        <ng-container actions>
            <spa-admin-sort-dropdown
                [availableSorts]="store.sortConfig()?.availableSorts || []"
                [sortCode]="sortCodeSig()"
                (sortChange)="onSortChange($event)"
            />
        </ng-container>
    </admin-page-header>

    <div class="flex flex-none flex-col gap-3 border-b bg-white px-6 py-4 dark:bg-slate-900 md:flex-row md:items-end">
        <spa-select
            class="md:w-56"
            [label]="'admin.commerce.notificationOutbox.filters.status' | transloco"
            [placeholder]="'admin.commerce.notificationOutbox.filters.allStatuses' | transloco"
            [options]="statusOptions"
            [value]="statusFilterSig()"
            (changed)="onStatusFilterChange($event)"
        />
        <spa-select
            class="md:w-72"
            [label]="'admin.commerce.notificationOutbox.filters.eventType' | transloco"
            [placeholder]="'admin.commerce.notificationOutbox.filters.allEvents' | transloco"
            [options]="eventTypeOptions"
            [value]="eventTypeFilterSig()"
            (changed)="onEventTypeFilterChange($event)"
        />
        <spa-input
            class="md:w-64"
            [label]="'admin.commerce.notificationOutbox.filters.aggregateUid' | transloco"
            [placeholder]="'admin.commerce.notificationOutbox.filters.aggregateUidPlaceholder' | transloco"
            [ngModel]="aggregateUidDraftSig()"
            (ngModelChange)="aggregateUidDraftSig.set($event ?? '')"
            (enter)="onAggregateUidFilterApply($event)"
        />
        <button mat-stroked-button type="button" class="md:mb-0.5" (click)="clearFilters()">
            <mat-icon svgIcon="heroicons_outline:x-mark"></mat-icon>
            <span>{{ 'admin.commerce.notificationOutbox.filters.clear' | transloco }}</span>
        </button>
    </div>

    <div class="flex flex-auto flex-col overflow-hidden">
        <div class="flex flex-auto flex-col overflow-y-auto">
            <spa-admin-grid
                [items]="store.items()"
                [columns]="columnsSig()"
                [actions]="actionsSig()"
                [isLoading]="store.isLoading()"
                [emptyTitle]="'admin.commerce.notificationOutbox.empty' | transloco"
                (actionClick)="onGridAction($event)"
                (rowClick)="openDetail($event)"
            />
        </div>

        @if (store.totalElements() > 0) {
            <spa-admin-paginator
                class="z-10 flex-none"
                [pageIndex]="pageIndexSig()"
                [pageSize]="pageSizeSig()"
                [length]="store.totalElements()"
                (pageCallback)="onPageChange($event)"
            />
        }
    </div>
</div>
