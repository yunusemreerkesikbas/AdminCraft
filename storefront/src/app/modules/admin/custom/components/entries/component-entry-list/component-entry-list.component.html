<div class="flex w-full flex-col">
    <div class="mb-6 flex items-center justify-between">
        <h3 class="m-0 text-lg font-semibold">
            {{ 'admin.components.entries.title' | transloco }}
        </h3>
        @if (!draftMode()) {
            <button mat-flat-button color="primary" (click)="createEntry()">
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                {{ 'admin.components.entries.addEntry' | transloco }}
            </button>
        }
    </div>

    <spa-admin-grid
        [items]="store.items()"
        [columns]="columns"
        [actions]="actions"
        [isLoading]="store.isLoading()"
        [emptyIcon]="'inbox'"
        [emptyTitle]="'admin.components.entries.noEntries'"
        [emptyDescription]="'admin.components.entries.noEntriesDesc'"
        (actionClick)="onGridAction($event)"
    >
        @if (!draftMode()) {
            <button
                emptyAction
                mat-stroked-button
                color="primary"
                (click)="createEntry()"
            >
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                {{ 'admin.components.entries.addEntry' | transloco }}
            </button>
        }
    </spa-admin-grid>
</div>

<ng-template #infoTemplate let-entry let-value="value">
    <div class="flex min-w-0 flex-col gap-1">
        <div class="flex items-center gap-3">
            @if (!entry.isVisible) {
                <mat-icon
                    class="text-hint icon-size-4"
                    [matTooltip]="'admin.components.entries.hidden' | transloco"
                    [svgIcon]="'heroicons_outline:eye-slash'"
                ></mat-icon>
            }
        </div>
        <div class="text-secondary flex items-center gap-2 text-sm">
            <span
                class="rounded bg-slate-100 px-1.5 py-0.5 font-mono text-xs dark:bg-slate-800"
            >
                {{ entry.uid }}
            </span>
        </div>
    </div>
</ng-template>
