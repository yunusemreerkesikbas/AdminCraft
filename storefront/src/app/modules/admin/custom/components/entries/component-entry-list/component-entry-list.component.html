<div class="flex w-full flex-col">
    <div class="mb-6 flex items-center justify-between">
        <h3 class="m-0 text-lg font-semibold">
            {{ 'admin.components.entries.title' | transloco }}
        </h3>
        <button mat-flat-button color="primary" (click)="createEntry()">
            <mat-icon>add</mat-icon>
            {{ 'admin.components.entries.addEntry' | transloco }}
        </button>
    </div>

    <spa-admin-grid
        [items]="store.items()"
        [columns]="columns"
        [actions]="actions"
        [isLoading]="store.isLoading()"
        [emptyIcon]="'inbox'"
        [emptyTitle]="'admin.components.entries.noEntries'"
        [emptyDescription]="'admin.components.entries.noEntriesDesc'"
        (actionClick)="onGridAction($event)"
    >
        <button
            emptyAction
            mat-stroked-button
            color="primary"
            (click)="createEntry()"
        >
            <mat-icon>add</mat-icon>
            {{ 'admin.components.entries.addEntry' | transloco }}
        </button>
    </spa-admin-grid>
</div>

<ng-template #infoTemplate let-entry let-value="value">
    <div class="flex min-w-0 flex-col gap-1">
        <div class="flex items-center gap-3">
            <span
                class="text-secondary rounded bg-slate-100 px-2 py-0.5 font-mono text-xs font-medium dark:bg-slate-800"
            >
                {{ entry.uid }}
            </span>
            <spa-status-badge
                [status]="entry.status"
                size="sm"
            ></spa-status-badge>
            @if (!entry.isVisible) {
                <mat-icon
                    class="text-hint icon-size-4"
                    [matTooltip]="'admin.components.entries.hidden' | transloco"
                    >visibility_off</mat-icon
                >
            }
        </div>
        @if (entry.translations && entry.translations['en']) {
            <span class="truncate text-sm font-medium">
                {{ entry.translations['en'].title || '-' }}
            </span>
        }
    </div>
</ng-template>
