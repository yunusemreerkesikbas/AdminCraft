<div
    class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent"
    [ngClass]="{
        'sm:absolute sm:inset-0 sm:overflow-hidden': mode === 'admin',
        'h-full overflow-hidden': mode === 'picker',
    }"
>
    @if (mode === 'admin') {
        <admin-page-header
            [title]="'admin.components.title'"
            [showCreateButton]="!isViewerSig()"
            [createButtonText]="'admin.common.create'"
            [isLoading]="store.isLoading()"
            (createClick)="createComponent()"
            [showSearch]="true"
            [searchPlaceholder]="'admin.common.searchPlaceholder'"
            (search)="searchInputControl.setValue($event)"
        >
            <ng-container actions>
                @if (showSelectionUi() && store.selectedCountSig() > 0) {
                    <button
                        mat-stroked-button
                        color="warn"
                        type="button"
                        (click)="deleteSelectedComponents()"
                    >
                        {{ 'admin.common.actions.deleteSelected' | transloco }}
                        ({{ store.selectedCountSig() }})
                    </button>
                }
                @if (availableSortsSig().length > 0) {
                    <spa-admin-sort-dropdown
                        [availableSorts]="availableSortsSig()"
                        [sortCode]="sortCodeSig()"
                        (sortChange)="onSortChange($event)"
                    >
                    </spa-admin-sort-dropdown>
                }
            </ng-container>
        </admin-page-header>
    }

    <div class="flex flex-auto flex-col overflow-hidden">
        <div class="flex flex-auto flex-col overflow-y-auto">
            <spa-admin-grid
                [items]="paginatedItemsSig()"
                [columns]="columns"
                [actions]="
                    mode === 'admin' && !isViewerSig() ? actions : []
                "
                [actionsTemplate]="
                    mode === 'picker' ? pickerActionsTemplate : undefined
                "
                [isLoading]="store.isLoading()"
                [emptyIcon]="'layers'"
                [emptyTitle]="'admin.components.noComponents'"
                [emptyDescription]="'admin.components.createFirstHint'"
                (actionClick)="onGridAction($event)"
            >
                <button
                    emptyAction
                    mat-flat-button
                    color="primary"
                    (click)="createComponent()"
                    [disabled]="!canCreateComponent()"
                >
                    <mat-icon>add</mat-icon>
                    {{ 'admin.common.create' | transloco }}
                </button>
            </spa-admin-grid>
        </div>

        @if (totalElementsSig() > 0) {
            <spa-admin-paginator
                class="z-10 flex-none"
                [length]="totalElementsSig()"
                [pageSize]="pageSizeSig()"
                [pageIndex]="pageIndexSig()"
                (pageCallback)="onPageChange($event)"
            >
            </spa-admin-paginator>
        }
    </div>
</div>

<ng-template #infoTemplate let-component>
    <div class="flex min-w-0 flex-col gap-1">
        <div class="flex items-center gap-3">
            <h3 class="truncate text-base font-semibold leading-none">
                {{ component.uid }}
            </h3>
        </div>
    </div>
</ng-template>

<ng-template #visibleTemplate let-component>
    <div class="inline-flex items-center text-sm font-medium">
        {{ component.isVisible }}
    </div>
</ng-template>

<ng-template #headerSelectAllTemplate>
    @if (showSelectionUi() && paginatedItemsSig().length > 0) {
        <mat-checkbox
            [checked]="pageSelectionState().allSelected"
            [indeterminate]="pageSelectionState().indeterminate"
            (change)="onToggleSelectAllOnPage($event)"
            (click)="$event.stopPropagation()"
            [attr.aria-label]="
                'admin.common.actions.selectAllOnPage' | transloco
            "
        ></mat-checkbox>
    }
</ng-template>

<ng-template #rowCheckboxTemplate let-component>
    <mat-checkbox
        [checked]="store.isSelected(component.id)"
        (change)="onRowCheckboxChange(component)"
        (click)="$event.stopPropagation()"
    ></mat-checkbox>
</ng-template>

<ng-template #pickerActionsTemplate let-component>
    <button
        mat-stroked-button
        color="primary"
        (click)="selectComponent(component)"
    >
        {{ 'admin.common.select' | transloco }}
    </button>
</ng-template>
