<div class="flex min-w-0 flex-auto flex-col">
    <!-- Header -->
    <admin-page-header
        [title]="'admin.components.title'"
        [showCreateButton]="true"
        [createButtonText]="'admin.common.create'"
        [isLoading]="store.isLoading()"
        (createClick)="createComponent()"
    >
        <div actions class="flex items-center gap-2">
            <button
                mat-icon-button
                (click)="loadItems()"
                [matTooltip]="'admin.common.refresh' | transloco"
            >
                <mat-icon>refresh</mat-icon>
            </button>
            <button
                mat-stroked-button
                (click)="openTypesManager()"
                class="hidden sm:inline-flex"
            >
                <mat-icon class="mr-2 icon-size-5">settings</mat-icon>
                {{ 'admin.components.manageTypes' | transloco }}
            </button>
        </div>
    </admin-page-header>

    <!-- Main Content -->
    <div class="flex-auto p-6 sm:p-10">
        <div class="mx-auto max-w-screen-xl">
            <!-- Filters -->
            <div class="mb-8 flex flex-col items-end gap-4 sm:flex-row">
                <spa-search-input
                    class="flex-auto"
                    [placeholder]="'admin.common.search' | transloco"
                    [ngModel]="searchTerm()"
                    (ngModelChange)="onSearchChange($event)"
                ></spa-search-input>

                <div class="flex gap-4">
                    <spa-select
                        class="w-full sm:w-48"
                        [label]="'admin.components.filters.type' | transloco"
                        [options]="typeOptions()"
                        (changed)="onTypeFilterChange($event)"
                    ></spa-select>

                    <spa-select
                        class="w-full sm:w-48"
                        [label]="'admin.components.filters.status' | transloco"
                        [options]="statusOptions"
                        (changed)="onStatusFilterChange($event)"
                    ></spa-select>
                </div>
            </div>

            <!-- List -->
            @if (filteredComponents().length > 0) {
                <div class="grid grid-cols-1 gap-4">
                    @for (
                        component of filteredComponents();
                        track component.id
                    ) {
                        <div
                            class="bg-card flex flex-col justify-between gap-4 rounded-lg border p-4 transition-shadow duration-200 hover:shadow-md sm:flex-row sm:items-center"
                            [@fadeInBottom]
                        >
                            <!-- Component Info -->
                            <div
                                class="flex min-w-0 flex-auto items-start gap-4"
                            >
                                <div class="flex min-w-0 flex-col gap-1">
                                    <div class="flex items-center gap-3">
                                        <h3
                                            class="truncate text-lg font-semibold leading-none"
                                        >
                                            {{ component.name }}
                                        </h3>
                                        <spa-status-badge
                                            [status]="component.status"
                                            size="sm"
                                        ></spa-status-badge>
                                    </div>

                                    <div
                                        class="text-secondary mt-1 flex flex-wrap items-center gap-x-6 gap-y-2 text-sm"
                                    >
                                        <div class="flex items-center gap-1.5">
                                            <span
                                                class="rounded bg-slate-100 px-1.5 py-0.5 font-mono text-xs dark:bg-slate-800"
                                            >
                                                {{ component.uid }}
                                            </span>
                                        </div>
                                        <div class="flex items-center gap-1.5">
                                            <mat-icon
                                                class="text-hint icon-size-4"
                                                >category</mat-icon
                                            >
                                            <span>{{
                                                component.componentTypeName ||
                                                    '-'
                                            }}</span>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Actions -->
                            <div
                                class="flex items-center gap-2 self-start sm:self-center"
                            >
                                <button
                                    mat-icon-button
                                    [matMenuTriggerFor]="menu"
                                    aria-label="Actions"
                                >
                                    <mat-icon>more_vert</mat-icon>
                                </button>
                                <mat-menu #menu="matMenu">
                                    <button
                                        mat-menu-item
                                        (click)="editComponent(component.id)"
                                    >
                                        <mat-icon>edit</mat-icon>
                                        <span>{{
                                            'admin.common.edit' | transloco
                                        }}</span>
                                    </button>
                                    <button
                                        mat-menu-item
                                        class="text-red-600"
                                        (click)="deleteComponent(component.id)"
                                    >
                                        <mat-icon class="text-red-600"
                                            >delete</mat-icon
                                        >
                                        <span>{{
                                            'admin.common.delete' | transloco
                                        }}</span>
                                    </button>
                                </mat-menu>
                            </div>
                        </div>
                    }
                </div>
            } @else {
                <spa-empty-state
                    icon="layers"
                    [title]="'admin.components.noComponents' | transloco"
                    [description]="
                        'admin.components.createFirstHint' | transloco
                    "
                >
                    <button
                        mat-flat-button
                        color="primary"
                        (click)="createComponent()"
                        [disabled]="!canCreateComponent()"
                    >
                        <mat-icon>add</mat-icon>
                        {{ 'admin.common.create' | transloco }}
                    </button>
                </spa-empty-state>
            }
        </div>
    </div>
</div>
