<div
    class="bg-card flex min-w-0 flex-auto flex-col sm:absolute sm:inset-0 sm:overflow-hidden dark:bg-transparent"
>
    @if (mode === 'admin') {
        <admin-page-header
            [title]="'admin.components.title'"
            [showCreateButton]="true"
            [createButtonText]="'admin.common.create'"
            [isLoading]="store.isLoading()"
            (createClick)="createComponent()"
            [showSearch]="true"
            [searchPlaceholder]="'admin.common.search'"
            (search)="onSearchChange($event)"
        >
            <div actions class="flex items-center gap-2">
                <button
                    mat-icon-button
                    (click)="loadItems()"
                    [matTooltip]="'admin.common.refresh' | transloco"
                >
                    <mat-icon>refresh</mat-icon>
                </button>
            </div>

            <button
                after-create
                mat-stroked-button
                (click)="openTypesManager()"
                class="hidden sm:inline-flex"
            >
                <mat-icon class="mr-2 icon-size-5">settings</mat-icon>
                {{ 'admin.components.manageTypes' | transloco }}
            </button>
        </admin-page-header>
    }

    <div class="flex flex-auto overflow-hidden">
        <div
            class="flex flex-auto flex-col overflow-hidden sm:mb-18 sm:overflow-y-auto"
        >
            <div class="flex-auto">
                <div class="">
                    <spa-admin-grid
                        [items]="filteredComponents()"
                        [columns]="columns"
                        [actions]="mode === 'admin' ? actions : []"
                        [actionsTemplate]="
                            mode === 'picker'
                                ? pickerActionsTemplate
                                : undefined
                        "
                        [isLoading]="store.isLoading()"
                        [emptyIcon]="'layers'"
                        [emptyTitle]="'admin.components.noComponents'"
                        [emptyDescription]="'admin.components.createFirstHint'"
                        (actionClick)="onGridAction($event)"
                    >
                        <button
                            emptyAction
                            mat-flat-button
                            color="primary"
                            (click)="createComponent()"
                            [disabled]="!canCreateComponent()"
                        >
                            <mat-icon>add</mat-icon>
                            {{ 'admin.common.create' | transloco }}
                        </button>
                    </spa-admin-grid>
                </div>
            </div>
        </div>
    </div>
</div>

<ng-template #infoTemplate let-component>
    <div class="flex min-w-0 flex-col gap-1">
        <div class="flex items-center gap-3">
            <h3 class="truncate text-base font-semibold leading-none">
                {{ component.name }}
            </h3>
            <spa-status-badge
                class="sm:hidden"
                [status]="component.status"
                size="sm"
            ></spa-status-badge>
        </div>
        <div class="text-secondary flex items-center gap-2 text-sm">
            <span
                class="rounded bg-slate-100 px-1.5 py-0.5 font-mono text-xs dark:bg-slate-800"
            >
                {{ component.uid }}
            </span>
            <span class="sm:hidden">{{
                component.componentTypeName || '-'
            }}</span>
        </div>
    </div>
</ng-template>

<ng-template #pickerActionsTemplate let-component>
    <button
        mat-stroked-button
        color="primary"
        (click)="selectComponent(component)"
    >
        {{ 'admin.common.select' | transloco }}
    </button>
</ng-template>
