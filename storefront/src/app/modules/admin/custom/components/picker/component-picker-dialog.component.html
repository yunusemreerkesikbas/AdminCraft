<spa-dialog-header
    [title]="'admin.common.selectComponent' | transloco"
    (closeClicked)="cancel()"
>
</spa-dialog-header>

<spa-dialog-content type="picker" class="flex h-full flex-col overflow-hidden">
    <spa-component-list
        mode="picker"
        (componentSelected)="select($event)"
        class="block h-full min-h-0"
    >
    </spa-component-list>
</spa-dialog-content>

<spa-dialog-footer [showSubmit]="false" (cancelClicked)="cancel()">
</spa-dialog-footer>
