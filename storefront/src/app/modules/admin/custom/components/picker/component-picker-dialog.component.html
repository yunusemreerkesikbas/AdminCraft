<spa-dialog
    [title]="'admin.common.selectComponent' | transloco"
    [size]="'xl'"
    [contentType]="'picker'"
    [showSubmit]="false"
    (closed)="cancel()"
    (cancelled)="cancel()"
>
    <div class="flex h-full flex-col overflow-hidden">
        <spa-component-list
            mode="picker"
            (componentSelected)="select($event)"
            class="block h-full min-h-0"
        >
        </spa-component-list>
    </div>
</spa-dialog>
