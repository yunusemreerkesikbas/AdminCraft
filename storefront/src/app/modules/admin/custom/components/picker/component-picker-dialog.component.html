<h2 mat-dialog-title>{{ 'admin.common.selectComponent' | transloco }}</h2>
<mat-dialog-content class="flex !min-h-[500px] flex-col !p-0">
    <spa-component-list
        mode="picker"
        (componentSelected)="select($event)"
    ></spa-component-list>
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-button mat-dialog-close>
        {{ 'admin.common.cancel' | transloco }}
    </button>
</mat-dialog-actions>
