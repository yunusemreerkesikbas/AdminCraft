<spa-dialog
    [title]="dialogTitleKeySig() | transloco"
    [subtitle]="data.scope === 'platform' ? ('admin.mailMarketing.subscribers.platformTitle' | transloco) : ('admin.mailMarketing.subscribers.tenantTitle' | transloco)"
    [size]="'lg'"
    [submitDisabled]="form.invalid"
    [isSubmitting]="isSubmittingSig()"
    submitLabel="admin.dialog.actions.save"
    cancelLabel="admin.dialog.actions.cancel"
    (closed)="cancel()"
    (cancelled)="cancel()"
    (submitted)="save()"
>
    <form class="subscriber-dialog-form" [formGroup]="form">
        <section class="subscriber-panel subscriber-panel--summary">
            <div class="subscriber-grid">
                <spa-input
                    formControlName="email"
                    [label]="'admin.mailMarketing.fields.email' | transloco"
                    [readonly]="data.mode === 'edit'"
                ></spa-input>

                <spa-select
                    formControlName="status"
                    [label]="'admin.mailMarketing.fields.status' | transloco"
                    [options]="statusOptions"
                >
                </spa-select>
            </div>
        </section>

        <section class="subscriber-panel">
            <div class="subscriber-panel__header">
                <div class="flex min-w-0 flex-col">
                    <h3 class="subscriber-panel__title">
                        {{ 'admin.mailMarketing.subscribers.fields.bindings' | transloco }}
                    </h3>
                </div>
                <button
                    mat-button
                    class="subscriber-panel__add-button"
                    type="button"
                    (click)="addSubscription()"
                    [disabled]="!canAddSubscription()"
                >
                    <mat-icon [svgIcon]="'heroicons_outline:plus'" class="icon-size-5"></mat-icon>
                    {{ 'admin.mailMarketing.subscribers.actions.addBinding' | transloco }}
                </button>
            </div>

            <div class="subscription-list" formArrayName="subscriptions">
                @for (group of subscriptionsArray.controls; track group; let index = $index) {
                    <article class="subscription-card" [formGroupName]="index">
                        <div class="subscription-card__header">
                            <span class="subscription-card__binding-title">
                                {{ 'admin.mailMarketing.subscribers.fields.binding' | transloco }}
                            </span>

                            <button
                                mat-icon-button
                                class="subscription-card__delete"
                                color="warn"
                                type="button"
                                (click)="removeSubscription(index)"
                                [disabled]="subscriptionsArray.length <= 1"
                                [attr.aria-label]="
                                    'admin.mailMarketing.subscribers.actions.deleteBindingAria'
                                        | transloco: { index: index + 1 }
                                "
                            >
                                <mat-icon [svgIcon]="'heroicons_outline:trash'" class="icon-size-5" aria-hidden="true"></mat-icon>
                            </button>
                        </div>

                        <div class="subscription-card__grid">
                            <spa-select
                                class="subscription-card__field subscription-card__field--template"
                                formControlName="templateType"
                                [label]="'admin.mailMarketing.fields.templateType' | transloco"
                                [options]="templateOptionsFor(index)"
                            >
                            </spa-select>

                            <spa-select
                                class="subscription-card__field subscription-card__field--language"
                                formControlName="preferredLanguage"
                                [label]="'admin.mailMarketing.fields.preferredLanguage' | transloco"
                                [options]="languageOptions"
                            >
                            </spa-select>

                            <spa-input
                                class="subscription-card__field subscription-card__field--source"
                                formControlName="source"
                                [label]="'admin.mailMarketing.fields.source' | transloco"
                            ></spa-input>
                        </div>

                        <div class="subscription-card__footer">
                            <spa-checkbox
                                class="subscription-card__permission"
                                formControlName="permission"
                                [label]="'admin.mailMarketing.subscribers.fields.permission' | transloco"
                            >
                            </spa-checkbox>
                        </div>
                    </article>
                }
            </div>
        </section>
    </form>
</spa-dialog>
