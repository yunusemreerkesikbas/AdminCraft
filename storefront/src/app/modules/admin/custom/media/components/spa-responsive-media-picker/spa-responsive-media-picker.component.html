<div class="flex flex-col gap-4 sm:flex-row">
    <!-- Desktop -->
    <div class="flex-2 w-full sm:w-2/3">
        <spa-media-picker
            [label]="'admin.media.responsive.desktop' | transloco"
            [formControl]="form.controls.desktop"
            [placeholder]="'admin.media.picker.desktopPlaceholder' | transloco"
        >
        </spa-media-picker>
        <div class="text-secondary mt-1 text-xs">
            {{ 'admin.media.responsive.desktopHint' | transloco }}
        </div>
    </div>

    <!-- Mobile -->
    <div class="w-full flex-1 sm:w-1/3">
        <spa-media-picker
            [label]="'admin.media.responsive.mobile' | transloco"
            [formControl]="form.controls.mobile"
            [placeholder]="'admin.media.picker.mobilePlaceholder' | transloco"
        >
        </spa-media-picker>
        <div class="text-secondary mt-1 text-xs">
            {{ 'admin.media.responsive.mobileHint' | transloco }}
        </div>
    </div>
</div>
