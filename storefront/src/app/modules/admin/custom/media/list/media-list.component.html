<div
    class="bg-card flex min-w-0 flex-auto flex-col sm:absolute sm:inset-0 sm:overflow-hidden dark:bg-transparent"
>
    <!-- Header -->
    <admin-page-header
        [title]="'admin.media.title' | transloco"
        [showCreateButton]="!isViewerSig()"
        [createButtonText]="'admin.media.upload'"
        (createClick)="openUploadDialog()"
        [showSearch]="true"
        [searchPlaceholder]="'admin.media.searchPlaceholder'"
        (search)="searchInputControl.setValue($event)"
    >
        <ng-container actions>
            @if (showSelectionUi() && selectedCountSig() > 0) {
                <button
                    mat-stroked-button
                    color="warn"
                    type="button"
                    (click)="deleteSelectedMedia()"
                >
                    {{ 'admin.common.actions.deleteSelected' | transloco }}
                    ({{ selectedCountSig() }})
                </button>
            }
            @if (availableSortsSig().length > 0) {
                <spa-admin-sort-dropdown
                    [availableSorts]="availableSortsSig()"
                    [sortCode]="sortCodeSig()"
                    (sortChange)="onSortDropdownChange($event)"
                >
                </spa-admin-sort-dropdown>
            }
        </ng-container>
    </admin-page-header>

    <!-- Main -->
    <div class="flex flex-auto flex-col overflow-hidden">
        <!-- Media files list -->
        <div class="flex flex-auto flex-col overflow-y-auto">
            <spa-admin-grid
                [items]="paginatedItemsSig()"
                [columns]="columns"
                [actions]="
                    isViewerSig() || selectionMode()
                        ? selectionMode()
                            ? actions
                            : []
                        : actions
                "
                [isLoading]="store.isLoading()"
                [emptyIcon]="'heroicons_outline:photo'"
                [emptyTitle]="'admin.media.list.empty'"
                [emptyDescription]="'admin.media.list.emptyDescription'"
                (actionClick)="onGridAction($event)"
            >
                <button
                    emptyAction
                    mat-flat-button
                    color="primary"
                    class="mt-6 rounded-full"
                    (click)="openUploadDialog()"
                    [disabled]="isViewerSig()"
                >
                    <mat-icon svgIcon="heroicons_outline:plus"></mat-icon>
                    <span class="ml-2">{{
                        'admin.media.actions.upload' | transloco
                    }}</span>
                </button>
            </spa-admin-grid>

            <ng-template #headerSelectAllTemplate>
                @if (showSelectionUi() && paginatedItemsSig().length > 0) {
                    <mat-checkbox
                        [checked]="pageSelectionState().allSelected"
                        [indeterminate]="pageSelectionState().indeterminate"
                        (change)="onToggleSelectAllOnPage($event)"
                        (click)="$event.stopPropagation()"
                        [attr.aria-label]="
                            'admin.common.actions.selectAllOnPage' | transloco
                        "
                    ></mat-checkbox>
                }
            </ng-template>

            <ng-template #rowCheckboxTemplate let-item>
                <mat-checkbox
                    [checked]="selectedIdsSig().includes(item.id)"
                    (change)="onRowCheckboxChange(item)"
                    (click)="$event.stopPropagation()"
                ></mat-checkbox>
            </ng-template>

            <ng-template #previewTemplate let-item>
                <div
                    class="relative flex h-20 w-20 items-center justify-center overflow-hidden rounded border bg-gray-50 dark:bg-gray-800"
                >
                    @if (item.fileType === 'image') {
                        <img
                            class="h-full w-full object-cover"
                            [src]="item.publicUrl"
                            [alt]="item.altText || item.fileName"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"
                        />
                        <div
                            class="absolute inset-0 flex hidden items-center justify-center bg-gray-100 dark:bg-gray-700"
                        >
                            <mat-icon
                                class="text-secondary icon-size-8"
                                svgIcon="heroicons_outline:photo"
                            ></mat-icon>
                        </div>
                    } @else {
                        <div
                            class="flex h-full w-full items-center justify-center"
                        >
                            <mat-icon
                                class="icon-size-8"
                                [class]="getMediaTypeClass(item)"
                                [svgIcon]="
                                    item.fileType === 'video'
                                        ? 'heroicons_outline:film'
                                        : item.fileType === 'audio'
                                          ? 'heroicons_outline:musical-note'
                                          : 'heroicons_outline:document-text'
                                "
                            >
                            </mat-icon>
                        </div>
                    }
                </div>
            </ng-template>

            <ng-template #nameTemplate let-item>
                <div class="min-w-0">
                    <div
                        class="truncate font-medium"
                        [matTooltip]="item.altText || item.originalName"
                    >
                        {{ item.altText || item.originalName }}
                    </div>
                    <div
                        class="text-secondary truncate text-sm"
                        [matTooltip]="item.fileName"
                    >
                        {{ item.fileName }}
                    </div>
                </div>
            </ng-template>
        </div>

        <!-- Pagination -->
        <spa-admin-paginator
            class="z-10 flex-none"
            [length]="totalElementsSig()"
            [pageSize]="pageSizeSig()"
            [pageIndex]="pageIndexSig()"
            [pageSizeOptions]="[5, 10, 25, 100]"
            (pageCallback)="onPageChange($event)"
        >
        </spa-admin-paginator>
    </div>
</div>
