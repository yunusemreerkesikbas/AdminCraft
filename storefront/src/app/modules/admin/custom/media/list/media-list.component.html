<div
    class="bg-card flex min-w-0 flex-auto flex-col sm:absolute sm:inset-0 sm:overflow-hidden dark:bg-transparent"
>
    <!-- Header -->
    <admin-page-header [title]="'admin.media.title' | transloco">
        <ng-container actions>
            <mat-form-field
                class="fuse-mat-dense fuse-mat-no-subscript fuse-mat-rounded min-w-64"
            >
                <mat-icon
                    class="icon-size-5"
                    matPrefix
                    [svgIcon]="'heroicons_solid:magnifying-glass'"
                ></mat-icon>
                <input
                    matInput
                    [formControl]="searchInputControl"
                    [autocomplete]="'off'"
                    [placeholder]="'admin.media.searchPlaceholder' | transloco"
                />
            </mat-form-field>

            <button
                class="ml-4"
                mat-flat-button
                [color]="'primary'"
                (click)="openUploadDialog()"
            >
                <mat-icon [svgIcon]="'heroicons_outline:plus'"></mat-icon>
                <span class="ml-2 mr-1">{{
                    'admin.media.upload' | transloco
                }}</span>
            </button>
        </ng-container>
    </admin-page-header>

    <!-- Main -->
    <div class="flex flex-auto overflow-hidden">
        <!-- Media files list -->
        <div
            class="flex flex-auto flex-col overflow-hidden sm:mb-18 sm:overflow-y-auto"
        >
            <spa-admin-grid
                [items]="paginatedItemsSig()"
                [columns]="columns"
                [actions]="actions"
                [isLoading]="store.isLoading()"
                [emptyIcon]="'heroicons_outline:photo'"
                [emptyTitle]="'admin.media.list.empty'"
                [emptyDescription]="'admin.media.list.emptyDescription'"
                (actionClick)="onGridAction($event)"
            >
                <button
                    emptyAction
                    mat-flat-button
                    color="primary"
                    class="mt-6 rounded-full"
                    (click)="openUploadDialog()"
                >
                    <mat-icon svgIcon="heroicons_outline:plus"></mat-icon>
                    <span class="ml-2">{{
                        'admin.media.actions.upload' | transloco
                    }}</span>
                </button>
            </spa-admin-grid>

            <ng-template #previewTemplate let-item>
                <div
                    class="relative flex h-20 w-20 items-center justify-center overflow-hidden rounded border bg-gray-50 dark:bg-gray-800"
                >
                    <ng-container
                        *ngIf="item.fileType === 'image'; else iconHandler"
                    >
                        <img
                            class="h-full w-full object-cover"
                            [src]="item.publicUrl"
                            [alt]="item.altText || item.fileName"
                            onerror="this.style.display='none'; this.nextElementSibling.style.display='flex'"
                        />
                        <div
                            class="absolute inset-0 flex hidden items-center justify-center bg-gray-100 dark:bg-gray-700"
                        >
                            <mat-icon
                                class="text-secondary icon-size-8"
                                svgIcon="heroicons_outline:photo"
                            ></mat-icon>
                        </div>
                    </ng-container>
                    <ng-template #iconHandler>
                        <div
                            class="flex h-full w-full items-center justify-center"
                        >
                            <mat-icon
                                class="icon-size-8"
                                [ngClass]="getMediaTypeClass(item)"
                                [svgIcon]="
                                    item.fileType === 'video'
                                        ? 'heroicons_outline:film'
                                        : item.fileType === 'audio'
                                          ? 'heroicons_outline:musical-note'
                                          : 'heroicons_outline:document-text'
                                "
                            >
                            </mat-icon>
                        </div>
                    </ng-template>
                </div>
            </ng-template>

            <ng-template #nameTemplate let-item>
                <div class="min-w-0">
                    <div
                        class="truncate font-medium"
                        [matTooltip]="item.altText || item.originalName"
                    >
                        {{ item.altText || item.originalName }}
                    </div>
                    <div
                        class="text-secondary truncate text-sm"
                        [matTooltip]="item.fileName"
                    >
                        {{ item.fileName }}
                    </div>
                </div>
            </ng-template>

            <!-- Pagination -->
            <mat-paginator
                class="z-10 border-b bg-gray-50 sm:absolute sm:inset-x-0 sm:bottom-0 sm:border-b-0 sm:border-t dark:bg-transparent"
                [ngClass]="{ 'pointer-events-none': store.isLoading() }"
                [length]="totalItemsSig()"
                [pageIndex]="pageIndexSig()"
                [pageSize]="pageSizeSig()"
                [pageSizeOptions]="[5, 10, 25, 100]"
                [showFirstLastButtons]="true"
                (page)="onPageChange($event)"
            >
            </mat-paginator>
        </div>
    </div>
</div>
