<spa-dialog-header
    [title]="
        isCreateMode()
            ? ('admin.navigation.nodes.create' | transloco)
            : ('admin.navigation.nodes.edit' | transloco)
    "
    (closeClicked)="cancel()"
>
</spa-dialog-header>

<spa-dialog-content type="form">
    <form [formGroup]="form" class="flex flex-col gap-4">
        @if (isCreateMode()) {
            <spa-input
                [label]="'admin.navigation.fields.uid' | transloco"
                formControlName="uid"
                [placeholder]="'e.g. main-menu-electronics'"
            />
        }

        <spa-select
            [label]="'admin.navigation.fields.position' | transloco"
            formControlName="position"
            [options]="positionOptions"
        />

        <div class="mt-2 flex gap-6">
            <spa-toggle
                formControlName="isVisible"
                [label]="'admin.navigation.fields.isVisible' | transloco"
            />

            <spa-toggle
                formControlName="isTab"
                [label]="'admin.navigation.fields.isTab' | transloco"
            />
        </div>

        <!-- i18n Tabs for title -->
        <div class="mt-2 border-t pt-4">
            <h4 class="mb-3 text-sm font-medium text-gray-700">
                {{ 'admin.common.translations' | transloco }}
            </h4>

            <mat-tab-group class="translations-tabs">
                @for (lang of supportedLanguages(); track lang.code) {
                    <mat-tab [label]="lang.nativeName">
                        <div class="pt-4">
                            <spa-input
                                [label]="
                                    'admin.navigation.fields.title' | transloco
                                "
                                [formControlName]="'title_' + lang.code"
                                [placeholder]="'Title in ' + lang.nativeName"
                            />
                        </div>
                    </mat-tab>
                }
            </mat-tab-group>
        </div>
    </form>
</spa-dialog-content>

<spa-dialog-footer
    [submitLabel]="
        isCreateMode()
            ? ('admin.common.create' | transloco)
            : ('admin.common.save' | transloco)
    "
    [submitDisabled]="form.invalid || isLoadingI18nSig()"
    [isSubmitting]="isSubmitting()"
    (cancelClicked)="cancel()"
    (submitClicked)="save()"
>
</spa-dialog-footer>
