<div class="flex h-full w-full min-w-0 flex-col">
    <admin-page-header
        [title]="'admin.navigation.title' | transloco"
        [subtitle]="'admin.navigation.subtitle' | transloco"
        [showCreateButton]="true"
        [createButtonText]="'admin.navigation.nodes.create' | transloco"
        (createClick)="openCreateDialog()"
    ></admin-page-header>

    <div class="flex-auto">
        <div class="bg-card flex h-full flex-col overflow-hidden">
            @if (dataSource.data.length === 0) {
                <spa-empty-state
                    [icon]="'heroicons_outline:bars-3'"
                    [title]="'admin.navigation.empty.title' | transloco"
                    [message]="'admin.navigation.empty.message' | transloco"
                    [actionLabel]="'admin.navigation.nodes.create' | transloco"
                    (actionClicked)="openCreateDialog()"
                ></spa-empty-state>
            } @else {
                <div class="flex-auto overflow-y-auto">
                    <mat-tree
                        [dataSource]="dataSource"
                        [treeControl]="treeControl"
                        class="navigation-tree"
                    >
                        <mat-tree-node *matTreeNodeDef="let node">
                            <div
                                class="group flex w-full items-center justify-between py-2 pr-4 transition-colors hover:bg-gray-50 dark:hover:bg-gray-800"
                            >
                                <div class="flex items-center gap-3 pl-4">
                                    <mat-icon
                                        [svgIcon]="'heroicons_outline:bars-3'"
                                        class="text-gray-400 icon-size-6"
                                    ></mat-icon>
                                    <div class="flex flex-col">
                                        <span
                                            class="font-medium text-gray-900 dark:text-gray-100"
                                            >{{ node.title }}</span
                                        >
                                        <span class="text-xs text-gray-500">{{
                                            node.uid
                                        }}</span>
                                    </div>
                                    @if (!node.isVisible) {
                                        <mat-icon
                                            class="text-warn-500 icon-size-4"
                                            [svgIcon]="
                                                'heroicons_outline:eye-slash'
                                            "
                                            [matTooltip]="
                                                'admin.common.fields.hidden'
                                                    | transloco
                                            "
                                        ></mat-icon>
                                    }
                                </div>
                                <div
                                    class="flex items-center gap-1 opacity-0 transition-opacity group-hover:opacity-100"
                                >
                                    <button
                                        mat-icon-button
                                        color="primary"
                                        (click)="
                                            openCreateDialog(node.id);
                                            $event.stopPropagation()
                                        "
                                        [matTooltip]="
                                            'admin.navigation.actions.addChild'
                                                | transloco
                                        "
                                    >
                                        <mat-icon
                                            [svgIcon]="
                                                'heroicons_outline:plus'
                                            "
                                            class="icon-size-5"
                                        ></mat-icon>
                                    </button>
                                    <button
                                        mat-icon-button
                                        (click)="
                                            openNodeManager(node);
                                            $event.stopPropagation()
                                        "
                                        [matTooltip]="
                                            'admin.common.manage' | transloco
                                        "
                                    >
                                        <mat-icon
                                            [svgIcon]="
                                                'heroicons_outline:pencil-square'
                                            "
                                            class="icon-size-5"
                                        ></mat-icon>
                                    </button>
                                    <button
                                        mat-icon-button
                                        color="warn"
                                        (click)="
                                            confirmDelete(node);
                                            $event.stopPropagation()
                                        "
                                        [matTooltip]="
                                            'admin.common.delete' | transloco
                                        "
                                    >
                                        <mat-icon
                                            [svgIcon]="
                                                'heroicons_outline:trash'
                                            "
                                            class="icon-size-5"
                                        ></mat-icon>
                                    </button>
                                </div>
                            </div>
                        </mat-tree-node>

                        <mat-nested-tree-node
                            *matTreeNodeDef="let node; when: hasChild"
                        >
                            <div class="mat-tree-node">
                                <div
                                    class="group flex w-full items-center justify-between py-2 pr-4 transition-colors hover:bg-gray-50 dark:hover:bg-gray-800"
                                >
                                    <div class="flex items-center gap-3 pl-4">
                                        <button
                                            mat-icon-button
                                            matTreeNodeToggle
                                            [attr.aria-label]="
                                                'Toggle ' + node.title
                                            "
                                        >
                                            <mat-icon
                                                class="text-gray-500 icon-size-5"
                                                [svgIcon]="
                                                    treeControl.isExpanded(node)
                                                        ? 'heroicons_outline:chevron-down'
                                                        : 'heroicons_outline:chevron-right'
                                                "
                                            >
                                            </mat-icon>
                                        </button>
                                        <mat-icon
                                            [svgIcon]="
                                                'heroicons_outline:bars-3'
                                            "
                                            class="text-gray-400 icon-size-6"
                                        ></mat-icon>
                                        <div class="flex flex-col">
                                            <span
                                                class="font-medium text-gray-900 dark:text-gray-100"
                                                >{{ node.title }}</span
                                            >
                                            <span
                                                class="text-xs text-gray-500"
                                                >{{ node.uid }}</span
                                            >
                                        </div>
                                        @if (!node.isVisible) {
                                            <mat-icon
                                                class="text-warn-500 icon-size-4"
                                                [svgIcon]="
                                                    'heroicons_outline:eye-slash'
                                                "
                                                [matTooltip]="
                                                    'admin.common.fields.hidden'
                                                        | transloco
                                                "
                                            ></mat-icon>
                                        }
                                    </div>
                                    <div
                                        class="flex items-center gap-1 opacity-0 transition-opacity group-hover:opacity-100"
                                    >
                                        <button
                                            mat-icon-button
                                            color="primary"
                                            (click)="
                                                openCreateDialog(node.id);
                                                $event.stopPropagation()
                                            "
                                            [matTooltip]="
                                                'admin.navigation.actions.addChild'
                                                    | transloco
                                            "
                                        >
                                            <mat-icon
                                                [svgIcon]="
                                                    'heroicons_outline:plus'
                                                "
                                                class="icon-size-5"
                                            ></mat-icon>
                                        </button>
                                        <button
                                            mat-icon-button
                                            (click)="
                                                openNodeManager(node);
                                                $event.stopPropagation()
                                            "
                                            [matTooltip]="
                                                'admin.common.manage'
                                                    | transloco
                                            "
                                        >
                                            <mat-icon
                                                [svgIcon]="
                                                    'heroicons_outline:pencil-square'
                                                "
                                                class="icon-size-5"
                                            ></mat-icon>
                                        </button>
                                        <button
                                            mat-icon-button
                                            color="warn"
                                            (click)="
                                                confirmDelete(node);
                                                $event.stopPropagation()
                                            "
                                            [matTooltip]="
                                                'admin.common.delete'
                                                    | transloco
                                            "
                                        >
                                            <mat-icon
                                                [svgIcon]="
                                                    'heroicons_outline:trash'
                                                "
                                                class="icon-size-5"
                                            ></mat-icon>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <div
                                [class.hidden]="!treeControl.isExpanded(node)"
                                role="group"
                                class="navigation-tree-nested-node"
                            >
                                <ng-container matTreeNodeOutlet></ng-container>
                            </div>
                        </mat-nested-tree-node>
                    </mat-tree>
                </div>
            }
        </div>
    </div>
</div>
