<div
    class="bg-card flex min-w-0 flex-auto flex-col sm:absolute sm:inset-0 sm:overflow-hidden dark:bg-transparent"
>
    <admin-page-header
        [title]="'admin.navigation.title' | transloco"
        [subtitle]="'admin.navigation.subtitle' | transloco"
        [showCreateButton]="true"
        [createButtonText]="'admin.navigation.nodes.create'"
        (createClick)="openCreateDialog()"
        [showSearch]="true"
        [searchPlaceholder]="'admin.common.actions.search'"
        (search)="searchInputControl.setValue($event)"
    >
        <ng-container actions>
            <!-- Sort Dropdown -->
            @if (availableSortsSig().length > 0) {
                <spa-admin-sort-dropdown
                    [availableSorts]="availableSortsSig()"
                    [sortCode]="sortCodeSig()"
                    (sortChange)="onSortChange($event)"
                >
                </spa-admin-sort-dropdown>
            }
        </ng-container>
    </admin-page-header>

    <div class="flex flex-auto flex-col overflow-hidden">
        <div class="flex flex-auto flex-col overflow-y-auto">
            <spa-admin-grid
                [items]="paginatedItemsSig()"
                [columns]="columns"
                [actions]="actions"
                [isLoading]="store.isLoading()"
                [emptyIcon]="'heroicons_outline:bars-3'"
                [emptyTitle]="'admin.common.noRecords'"
                [emptyDescription]="'admin.common.actions.createFirst'"
                (actionClick)="onGridAction($event)"
            >
                <button
                    emptyAction
                    mat-flat-button
                    color="primary"
                    class="mt-6 rounded-full"
                    (click)="openCreateDialog()"
                >
                    <mat-icon svgIcon="heroicons_outline:plus"></mat-icon>
                    <span class="ml-2">{{
                        'admin.navigation.nodes.create' | transloco
                    }}</span>
                </button>
            </spa-admin-grid>
        </div>

        <!-- Paginator -->
        @if (totalElementsSig() > 0) {
            <spa-admin-paginator
                class="z-10 flex-none"
                [length]="totalElementsSig()"
                [pageSize]="pageSizeSig()"
                [pageIndex]="pageIndexSig()"
                (pageCallback)="onPageChange($event)"
            >
            </spa-admin-paginator>
        }
    </div>
</div>
