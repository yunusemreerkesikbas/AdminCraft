<div class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent">
    <div class="relative flex flex-0 flex-col border-b px-6 py-4 md:px-8">
        @if (isLoading) {
            <div class="absolute inset-x-0 bottom-0">
                <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
            </div>
        }
        <div class="text-lg font-semibold">Bloklar</div>
        <div class="mt-4 grid gap-4 md:grid-cols-2">
            <spa-input
                [label]="'Tür'"
                [type]="'text'"
                [(ngModel)]="type"
            ></spa-input>
            <spa-textarea
                [label]="'Veri (JSON)'"
                [rows]="3"
                [(ngModel)]="data"
            ></spa-textarea>
        </div>
        <div class="mt-3">
            <button mat-flat-button [color]="'primary'" (click)="add()">
                Ekle
            </button>
        </div>
    </div>

    <div class="p-6">
        <div cdkDropList (cdkDropListDropped)="drop($event)" class="grid gap-2">
            @for (b of blocks; track trackById; let i = $index) {
                <div
                    class="flex items-center justify-between rounded border px-3 py-2"
                    cdkDrag
                >
                    <div class="flex-1">
                        <div class="font-medium">
                            {{ b.type || 'block' }} #{{ i + 1 }}
                        </div>
                        <div class="text-secondary text-xs">
                            Sıra: {{ b.displayOrder }}
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <button
                            mat-stroked-button
                            color="warn"
                            (click)="remove(b)"
                        >
                            Sil
                        </button>
                        <mat-icon
                            class="icon-size-5"
                            [svgIcon]="'heroicons_outline:bars-3'"
                            cdkDragHandle
                        ></mat-icon>
                    </div>
                </div>
            }
        </div>
    </div>
</div>
