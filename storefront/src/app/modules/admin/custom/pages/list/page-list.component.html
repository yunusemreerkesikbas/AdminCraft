<div
    class="bg-card flex min-w-0 flex-auto flex-col sm:absolute sm:inset-0 sm:overflow-hidden dark:bg-transparent"
>
    <admin-page-header
        [title]="'admin.pages.title' | transloco"
        [showCreateButton]="true"
        [createButtonText]="'admin.pages.actions.create'"
        (createClick)="createPage()"
        [showSearch]="true"
        [searchPlaceholder]="'admin.common.searchPlaceholder'"
        (search)="searchInputControl.setValue($event)"
    >
        <ng-container actions> </ng-container>
    </admin-page-header>

    <div class="flex flex-auto flex-col overflow-hidden">
        <div class="flex flex-auto flex-col overflow-y-auto">
            <spa-admin-grid
                [items]="paginatedItemsSig()"
                [columns]="columns"
                [actions]="actions"
                [isLoading]="store.isLoading()"
                [emptyIcon]="'heroicons_outline:document-text'"
                [emptyTitle]="'admin.pages.list.empty.title'"
                [emptyDescription]="'admin.pages.list.empty.description'"
                (actionClick)="onGridAction($event)"
            >
                <button
                    emptyAction
                    mat-flat-button
                    color="primary"
                    (click)="createPage()"
                >
                    <mat-icon svgIcon="heroicons_outline:plus"></mat-icon>
                    <span class="ml-2">{{
                        'admin.pages.actions.create' | transloco
                    }}</span>
                </button>
            </spa-admin-grid>

            <ng-template #statusTemplate let-item>
                <spa-status-badge
                    [status]="item.status"
                    size="sm"
                ></spa-status-badge>
            </ng-template>
        </div>

        <spa-admin-paginator
            class="z-10 flex-none"
            [length]="totalItemsSig()"
            [pageSize]="pageSizeSig()"
            [pageIndex]="pageIndexSig()"
            [pageSizeOptions]="[10, 24, 50, 100]"
            (pageCallback)="onPageChange($event)"
        >
        </spa-admin-paginator>
    </div>
</div>
