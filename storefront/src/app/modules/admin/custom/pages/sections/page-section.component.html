<div class="bg-card flex min-w-0 flex-auto flex-col dark:bg-transparent">
    <div class="relative flex flex-0 flex-col border-b px-6 py-4 md:px-8">
        @if (isLoading) {
            <div class="absolute inset-x-0 bottom-0">
                <mat-progress-bar [mode]="'indeterminate'"></mat-progress-bar>
            </div>
        }
        <div class="text-xl font-semibold">Bölümler</div>
        <div class="mt-4 grid gap-4 md:grid-cols-2">
            <spa-input
                [label]="'Tür'"
                [type]="'text'"
                [(ngModel)]="type"
            ></spa-input>
            <spa-textarea
                [label]="'Veri (JSON)'"
                [rows]="3"
                [(ngModel)]="data"
            ></spa-textarea>
        </div>
        <div class="mt-3">
            <button mat-flat-button [color]="'primary'" (click)="add()">
                Ekle
            </button>
        </div>
    </div>

    <div class="p-6">
        <div cdkDropList (cdkDropListDropped)="drop($event)" class="grid gap-2">
            @for (s of sections; track trackById; let i = $index) {
                <div class="rounded border" cdkDrag>
                    <div
                        class="flex items-center justify-between border-b px-3 py-2"
                    >
                        <div class="flex-1">
                            <div class="font-medium">
                                {{ s.type || 'section' }} #{{ i + 1 }}
                            </div>
                            <div class="text-secondary text-xs">
                                Sıra: {{ s.displayOrder }}
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <mat-icon
                                class="icon-size-5"
                                [svgIcon]="'heroicons_outline:bars-3'"
                                cdkDragHandle
                            ></mat-icon>
                        </div>
                    </div>
                    <div class="p-3">
                        <spa-page-block [sectionId]="s.id"></spa-page-block>
                    </div>
                </div>
            }
        </div>
    </div>
</div>
