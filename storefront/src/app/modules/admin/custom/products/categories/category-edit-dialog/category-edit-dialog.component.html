<spa-dialog-header
    [title]="
        (data.mode === 'create'
            ? 'admin.products.categories.create'
            : 'admin.products.categories.edit'
        ) | transloco
    "
    (closeClicked)="cancel()"
></spa-dialog-header>

<spa-dialog-content type="tabbed">
    <spa-tab-container [tabs]="tabs()" [(activeTabIndex)]="activeTab">
        <ng-template spaTabContent="general">
            <form [formGroup]="generalForm" class="mt-4 flex flex-col gap-4">
                <spa-input
                    formControlName="code"
                    [label]="'admin.common.fields.code' | transloco"
                    [required]="true"
                    [placeholder]="'admin.common.placeholders.code' | transloco"
                    [labelTooltip]="'code'"
                    [readonly]="data.mode === 'edit'"
                ></spa-input>

                <spa-select
                    formControlName="parentId"
                    [label]="
                        'admin.products.categories.fields.parent' | transloco
                    "
                    [options]="parentOptions()"
                    [placeholder]="
                        'admin.common.placeholders.parent' | transloco
                    "
                    [labelTooltip]="'parentId'"
                ></spa-select>

                <spa-input
                    formControlName="sortOrder"
                    type="number"
                    [label]="'admin.common.fields.order' | transloco"
                    [placeholder]="
                        'admin.common.placeholders.sortOrder' | transloco
                    "
                    [labelTooltip]="'sortOrder'"
                ></spa-input>

                <spa-checkbox
                    formControlName="isVisible"
                    [label]="'admin.common.fields.isVisible' | transloco"
                    [labelTooltip]="'isVisible'"
                    styleClasses="boxed"
                ></spa-checkbox>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <spa-input
                        formControlName="createdAt"
                        [label]="
                            'admin.common.fields.createdAt' | transloco
                        "
                        [labelTooltip]="'createdAt'"
                        [placeholder]="
                            'admin.common.placeholders.autoGenerated'
                                | transloco
                        "
                        [readonly]="true"
                    ></spa-input>

                    <spa-input
                        formControlName="updatedAt"
                        [label]="
                            'admin.common.fields.updatedAt' | transloco
                        "
                        [labelTooltip]="'updatedAt'"
                        [placeholder]="
                            'admin.common.placeholders.autoGenerated'
                                | transloco
                        "
                        [readonly]="true"
                    ></spa-input>
                </div>
            </form>
        </ng-template>

        @for (lang of languages; track lang) {
            <ng-template [spaTabContent]="'lang-' + lang">
                <form
                    [formGroup]="i18nForms[lang]"
                    class="mt-4 flex flex-col gap-4"
                >
                    <spa-input
                        formControlName="name"
                        [label]="'admin.common.fields.name' | transloco"
                        [required]="true"
                        [placeholder]="
                            'admin.common.placeholders.name' | transloco
                        "
                        [labelTooltip]="'name'"
                    ></spa-input>

                    <spa-textarea
                        formControlName="description"
                        [label]="'admin.common.fields.description' | transloco"
                        [placeholder]="
                            'admin.common.placeholders.description' | transloco
                        "
                        [labelTooltip]="'description'"
                        [rows]="4"
                    ></spa-textarea>
                </form>
            </ng-template>
        }
    </spa-tab-container>
</spa-dialog-content>

<spa-dialog-footer
    [submitLabel]="
        (data.mode === 'create' ? 'admin.common.create' : 'admin.common.save')
            | transloco
    "
    (submitClicked)="save()"
    (cancelClicked)="cancel()"
></spa-dialog-footer>
