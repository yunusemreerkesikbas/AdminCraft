<div class="flex h-full w-full min-w-0 flex-col">
    <admin-page-header
        [title]="'admin.products.categories.title' | transloco"
        [subtitle]="'admin.products.categories.subtitle' | transloco"
        [showCreateButton]="true"
        [createButtonText]="'admin.products.categories.add' | transloco"
        (createClick)="createCategory()"
    ></admin-page-header>

    <div class="flex-auto">
        <div class="bg-card flex h-full flex-col overflow-hidden">
            @if (dataSource.data.length === 0) {
                <spa-empty-state
                    [icon]="'heroicons_outline:folder-open'"
                    [title]="
                        'admin.products.categories.empty.title' | transloco
                    "
                    [message]="
                        'admin.products.categories.empty.message' | transloco
                    "
                    [actionLabel]="'admin.products.categories.add' | transloco"
                    (actionClicked)="createCategory()"
                ></spa-empty-state>
            } @else {
                <div
                    class="flex-auto overflow-y-auto"
                    cdkDropList
                    (cdkDropListDropped)="drop($event)"
                >
                    <mat-tree
                        [dataSource]="dataSource"
                        [treeControl]="treeControl"
                        class="category-tree"
                    >
                        <!-- Leaf Node -->
                        <mat-tree-node
                            *matTreeNodeDef="let node"
                            matTreeNodeToggle
                            cdkDrag
                            [cdkDragData]="node"
                        >
                            <div
                                class="cdk-drag-placeholder"
                                *cdkDragPlaceholder
                            ></div>
                            <div
                                class="group flex w-full items-center justify-between py-2 pr-4 transition-colors hover:bg-gray-50 dark:hover:bg-gray-800"
                            >
                                <div class="flex items-center gap-3 pl-4">
                                    <div
                                        class="cursor-move text-gray-400"
                                        cdkDragHandle
                                    >
                                        <mat-icon
                                            [svgIcon]="
                                                'heroicons_outline:bars-2'
                                            "
                                            class="icon-size-5"
                                        ></mat-icon>
                                    </div>
                                    <mat-icon
                                        [svgIcon]="'heroicons_outline:tag'"
                                        class="text-gray-400 icon-size-6"
                                    ></mat-icon>
                                    <div class="flex flex-col">
                                        <span
                                            class="font-medium text-gray-900 dark:text-gray-100"
                                            >{{ node.name }}</span
                                        >
                                        <span class="text-xs text-gray-500">{{
                                            node.code
                                        }}</span>
                                    </div>
                                    @if (!node.isVisible) {
                                        <mat-icon
                                            class="text-warn-500 icon-size-4"
                                            [svgIcon]="
                                                'heroicons_outline:eye-slash'
                                            "
                                            [matTooltip]="
                                                'admin.common.fields.hidden'
                                                    | transloco
                                            "
                                        ></mat-icon>
                                    }
                                </div>
                                <div
                                    class="flex items-center gap-1 opacity-0 transition-opacity group-hover:opacity-100"
                                >
                                    <button
                                        mat-icon-button
                                        color="primary"
                                        (click)="createCategory(node.id)"
                                        [matTooltip]="
                                            'admin.products.categories.addChild'
                                                | transloco
                                        "
                                    >
                                        <mat-icon
                                            [svgIcon]="'heroicons_outline:plus'"
                                            class="icon-size-5"
                                        ></mat-icon>
                                    </button>
                                    <button
                                        mat-icon-button
                                        (click)="editCategory(node)"
                                    >
                                        <mat-icon
                                            [svgIcon]="
                                                'heroicons_outline:pencil-square'
                                            "
                                            class="icon-size-5"
                                        ></mat-icon>
                                    </button>
                                    <button
                                        mat-icon-button
                                        color="warn"
                                        (click)="deleteCategory(node)"
                                    >
                                        <mat-icon
                                            [svgIcon]="
                                                'heroicons_outline:trash'
                                            "
                                            class="icon-size-5"
                                        ></mat-icon>
                                    </button>
                                </div>
                            </div>
                        </mat-tree-node>

                        <!-- Parent Node -->
                        <mat-nested-tree-node
                            *matTreeNodeDef="let node; when: hasChild"
                            cdkDrag
                            [cdkDragData]="node"
                        >
                            <div
                                class="cdk-drag-placeholder"
                                *cdkDragPlaceholder
                            ></div>
                            <div class="mat-tree-node">
                                <div
                                    class="group flex w-full items-center justify-between py-2 pr-4 transition-colors hover:bg-gray-50 dark:hover:bg-gray-800"
                                >
                                    <div class="flex items-center gap-3 pl-4">
                                        <div
                                            class="cursor-move text-gray-400"
                                            cdkDragHandle
                                        >
                                            <mat-icon
                                                [svgIcon]="
                                                    'heroicons_outline:bars-2'
                                                "
                                                class="icon-size-5"
                                            ></mat-icon>
                                        </div>
                                        <button
                                            mat-icon-button
                                            matTreeNodeToggle
                                            [attr.aria-label]="
                                                'Toggle ' + node.name
                                            "
                                        >
                                            <mat-icon
                                                class="text-gray-500 icon-size-5"
                                                [svgIcon]="
                                                    treeControl.isExpanded(node)
                                                        ? 'heroicons_outline:chevron-down'
                                                        : 'heroicons_outline:chevron-right'
                                                "
                                            >
                                            </mat-icon>
                                        </button>
                                        <div class="flex flex-col">
                                            <span
                                                class="font-medium text-gray-900 dark:text-gray-100"
                                                >{{ node.name }}</span
                                            >
                                            <span
                                                class="text-xs text-gray-500"
                                                >{{ node.code }}</span
                                            >
                                        </div>
                                        @if (!node.isVisible) {
                                            <mat-icon
                                                class="text-warn-500 icon-size-4"
                                                [svgIcon]="
                                                    'heroicons_outline:eye-slash'
                                                "
                                                [matTooltip]="
                                                    'admin.common.fields.hidden'
                                                        | transloco
                                                "
                                            ></mat-icon>
                                        }
                                    </div>
                                    <div
                                        class="flex items-center gap-1 opacity-0 transition-opacity group-hover:opacity-100"
                                    >
                                        <button
                                            mat-icon-button
                                            color="primary"
                                            (click)="createCategory(node.id)"
                                            [matTooltip]="
                                                'admin.products.categories.addChild'
                                                    | transloco
                                            "
                                        >
                                            <mat-icon
                                                [svgIcon]="
                                                    'heroicons_outline:plus'
                                                "
                                                class="icon-size-5"
                                            ></mat-icon>
                                        </button>
                                        <button
                                            mat-icon-button
                                            (click)="editCategory(node)"
                                        >
                                            <mat-icon
                                                [svgIcon]="
                                                    'heroicons_outline:pencil-square'
                                                "
                                                class="icon-size-5"
                                            ></mat-icon>
                                        </button>
                                        <button
                                            mat-icon-button
                                            color="warn"
                                            (click)="deleteCategory(node)"
                                        >
                                            <mat-icon
                                                [svgIcon]="
                                                    'heroicons_outline:trash'
                                                "
                                                class="icon-size-5"
                                            ></mat-icon>
                                        </button>
                                    </div>
                                </div>
                            </div>
                            <!-- Nested Group Container -->
                            <div
                                [class.hidden]="!treeControl.isExpanded(node)"
                                role="group"
                                class="category-tree-nested-node"
                            >
                                <ng-container matTreeNodeOutlet></ng-container>
                            </div>
                        </mat-nested-tree-node>
                    </mat-tree>
                </div>
            }
            <spa-admin-paginator
                class="border-t bg-gray-50 dark:bg-gray-900"
                [length]="0"
                [pageSize]="10"
                [pageIndex]="0"
            ></spa-admin-paginator>
        </div>
    </div>
</div>
