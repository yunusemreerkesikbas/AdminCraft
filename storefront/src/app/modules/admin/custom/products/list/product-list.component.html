<div
    class="bg-card flex min-w-0 flex-auto flex-col sm:absolute sm:inset-0 sm:overflow-hidden dark:bg-transparent"
>
    <admin-page-header
        [title]="'admin.products.title' | transloco"
        [subtitle]="'admin.products.description' | transloco"
        [showCreateButton]="true"
        [createButtonText]="'admin.common.actions.create' | transloco"
        (createClick)="createProduct()"
        [showSearch]="true"
        [searchPlaceholder]="'admin.common.searchPlaceholder' | transloco"
        (search)="onSearchInput($event)"
    ></admin-page-header>

    <div class="flex flex-auto flex-col overflow-hidden">
        <div class="flex flex-auto flex-col overflow-y-auto">
            <spa-admin-grid
                [items]="store.items()"
                [columns]="columns"
                [actions]="actions"
                [isLoading]="store.isLoading()"
                (actionClick)="onGridAction($event)"
            ></spa-admin-grid>
        </div>

        @if (totalElementsSig() > 0) {
            <spa-admin-paginator
                class="z-10 flex-none"
                [length]="totalElementsSig()"
                [pageSize]="pageSizeSig()"
                [pageIndex]="pageIndexSig()"
                (page)="onPageChange($event)"
            ></spa-admin-paginator>
        }
    </div>
</div>
