<spa-dialog-header
    [title]="
        (data.mode === 'create'
            ? 'admin.products.create'
            : 'admin.products.edit'
        ) | transloco
    "
    (closeClicked)="cancel()"
></spa-dialog-header>

<spa-dialog-content type="tabbed">
    @if (isLoadingSig()) {
        <div class="flex justify-center p-8">
            <mat-progress-spinner
                mode="indeterminate"
                diameter="40"
            ></mat-progress-spinner>
        </div>
    } @else {
        <spa-tab-container [tabs]="tabs" [(activeTabIndex)]="activeTab">
            <ng-template spaTabContent="general">
                <form
                    [formGroup]="generalForm"
                    class="mt-4 flex flex-col gap-4"
                >
                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <spa-input
                            formControlName="sku"
                            [label]="'admin.products.fields.sku' | transloco"
                            [required]="true"
                            [labelTooltip]="'sku'"
                            [placeholder]="
                                'admin.common.placeholders.sku' | transloco
                            "
                        ></spa-input>

                        <spa-select
                            formControlName="status"
                            [label]="'admin.common.fields.status' | transloco"
                            [options]="statusOptions"
                            [required]="true"
                            [labelTooltip]="'status'"
                            [placeholder]="
                                'admin.common.placeholders.selectStatus'
                                    | transloco
                            "
                        ></spa-select>
                    </div>

                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <spa-input
                            formControlName="basePrice"
                            type="number"
                            [label]="'admin.products.fields.price' | transloco"
                            [required]="true"
                            [labelTooltip]="'basePrice'"
                            [placeholder]="
                                'admin.common.placeholders.price' | transloco
                            "
                        ></spa-input>
                    </div>

                    <spa-select
                        formControlName="productTypeId"
                        [label]="'admin.products.fields.type' | transloco"
                        [options]="productTypes()"
                        [optionLabel]="'name'"
                        [optionValue]="'id'"
                        [required]="true"
                        [readonly]="data.mode === 'edit'"
                        [labelTooltip]="'productTypeId'"
                        [placeholder]="
                            'admin.common.placeholders.selectType' | transloco
                        "
                    ></spa-select>

                    <spa-checkbox
                        formControlName="isVisible"
                        [label]="'admin.common.fields.isVisible' | transloco"
                        [labelTooltip]="'isVisible'"
                        styleClasses="boxed"
                    ></spa-checkbox>

                    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                        <spa-input
                            formControlName="createdAt"
                            [label]="
                                'admin.common.fields.createdAt' | transloco
                            "
                            [labelTooltip]="'createdAt'"
                            [placeholder]="
                                'admin.common.placeholders.autoGenerated'
                                    | transloco
                            "
                            [readonly]="true"
                        ></spa-input>

                        <spa-input
                            formControlName="updatedAt"
                            [label]="
                                'admin.common.fields.updatedAt' | transloco
                            "
                            [labelTooltip]="'updatedAt'"
                            [placeholder]="
                                'admin.common.placeholders.autoGenerated'
                                    | transloco
                            "
                            [readonly]="true"
                        ></spa-input>
                    </div>
                </form>
            </ng-template>

            @for (lang of languages; track lang) {
                <ng-template [spaTabContent]="'lang-' + lang">
                    <form
                        [formGroup]="i18nForms[lang]"
                        class="mt-4 flex flex-col gap-4"
                    >
                        <spa-input
                            formControlName="name"
                            [label]="'admin.common.fields.name' | transloco"
                            [labelTooltip]="'name'"
                            [placeholder]="
                                'admin.common.placeholders.name' | transloco
                            "
                        ></spa-input>

                        <spa-textarea
                            formControlName="shortDescription"
                            [label]="
                                'admin.products.fields.shortDescription'
                                    | transloco
                            "
                            [labelTooltip]="'shortDescription'"
                            [rows]="2"
                            [placeholder]="
                                'admin.common.placeholders.shortDescription'
                                    | transloco
                            "
                        ></spa-textarea>

                        <spa-textarea
                            formControlName="description"
                            [label]="
                                'admin.products.fields.description' | transloco
                            "
                            [labelTooltip]="'description'"
                            [rows]="5"
                            [placeholder]="
                                'admin.common.placeholders.description'
                                    | transloco
                            "
                        ></spa-textarea>

                        <div class="mt-2 border-t pt-4">
                            <h3 class="text-secondary mb-2 text-sm font-medium">
                                {{ 'admin.products.sections.seo' | transloco }}
                            </h3>
                            <div class="flex flex-col gap-4">
                                <spa-input
                                    formControlName="seoTitle"
                                    [label]="
                                        'admin.products.fields.seoTitle'
                                            | transloco
                                    "
                                    [labelTooltip]="'seoTitle'"
                                    [placeholder]="
                                        'admin.common.placeholders.title'
                                            | transloco
                                    "
                                ></spa-input>
                                <spa-textarea
                                    formControlName="seoDescription"
                                    [label]="
                                        'admin.products.fields.seoDescription'
                                            | transloco
                                    "
                                    [labelTooltip]="'seoDescription'"
                                    [rows]="2"
                                    [placeholder]="
                                        'admin.common.placeholders.description'
                                            | transloco
                                    "
                                ></spa-textarea>
                            </div>
                        </div>
                    </form>
                </ng-template>
            }

            <ng-template spaTabContent="attributes">
                <div class="mt-4">
                    <spa-dynamic-form
                        [form]="attributesForm"
                        [fields]="dynamicFieldsConfig()"
                    ></spa-dynamic-form>
                </div>
            </ng-template>

            <ng-template spaTabContent="categories">
                <form
                    [formGroup]="generalForm"
                    class="mt-4 flex flex-col gap-4"
                >
                    <spa-select
                        formControlName="primaryCategoryId"
                        [label]="
                            'admin.products.fields.primaryCategory' | transloco
                        "
                        [options]="categories()"
                        [optionLabel]="'code'"
                        [optionValue]="'id'"
                        [labelTooltip]="'primaryCategoryId'"
                        [placeholder]="
                            'admin.common.placeholders.select' | transloco
                        "
                    ></spa-select>

                    <spa-select
                        formControlName="categoryIds"
                        [label]="'admin.products.fields.categories' | transloco"
                        [options]="categories()"
                        [optionLabel]="'code'"
                        [optionValue]="'id'"
                        [multiple]="true"
                        [labelTooltip]="'categoryIds'"
                        [placeholder]="
                            'admin.common.placeholders.select' | transloco
                        "
                    ></spa-select>
                </form>
            </ng-template>

            <ng-template spaTabContent="media">
                <form
                    [formGroup]="generalForm"
                    class="mt-4 flex flex-col gap-6"
                >
                    <!-- Responsive Image -->
                    <div
                        class="rounded-lg border bg-gray-50 p-4 dark:bg-gray-800/50"
                    >
                        <h3 class="mb-4 text-sm font-medium">
                            {{ 'admin.products.media.mainImage' | transloco }}
                        </h3>
                        <spa-media-picker
                            formControlName="responsiveMedia"
                            [responsive]="true"
                        ></spa-media-picker>
                    </div>

                    <!-- Gallery -->
                    <div
                        class="rounded-lg border bg-gray-50 p-4 dark:bg-gray-800/50"
                    >
                        <h3 class="mb-4 text-sm font-medium">
                            {{ 'admin.products.media.gallery' | transloco }}
                        </h3>
                        <spa-media-picker
                            formControlName="galleryImages"
                            [multiple]="true"
                            [responsive]="true"
                        ></spa-media-picker>
                    </div>
                </form>
            </ng-template>
        </spa-tab-container>
    }
</spa-dialog-content>

<spa-dialog-footer
    [submitLabel]="
        (data.mode === 'create' ? 'admin.common.create' : 'admin.common.save')
            | transloco
    "
    (submitClicked)="save()"
    (cancelClicked)="cancel()"
    [submitDisabled]="isLoadingSig()"
></spa-dialog-footer>
