<spa-dialog-header
    [title]="
        (data.mode === 'create'
            ? 'admin.products.attributes.create'
            : 'admin.products.attributes.edit'
        ) | transloco
    "
    (closeClicked)="cancel()"
></spa-dialog-header>

<spa-dialog-content>
    <form [formGroup]="generalForm" class="flex flex-col gap-4">
        <spa-input
            formControlName="name"
            [label]="'admin.common.fields.name' | transloco"
            [required]="true"
            [placeholder]="'admin.common.placeholders.name' | transloco"
            [labelTooltip]="'name'"
        ></spa-input>

        <spa-select
            formControlName="fieldType"
            [label]="'admin.products.attributes.fields.type' | transloco"
            [options]="fieldTypes"
            [required]="true"
            [placeholder]="
                'admin.products.attributes.placeholders.type' | transloco
            "
            [labelTooltip]="'fieldType'"
            [disabled]="data.mode === 'edit'"
        ></spa-select>
    </form>
</spa-dialog-content>

<spa-dialog-footer
    [submitLabel]="
        (data.mode === 'create' ? 'admin.common.create' : 'admin.common.save')
            | transloco
    "
    (submitClicked)="save()"
    (cancelClicked)="cancel()"
></spa-dialog-footer>
