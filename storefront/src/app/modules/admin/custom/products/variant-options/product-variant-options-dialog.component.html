<spa-dialog-header
    title="Variant Options"
    (closeClicked)="close()"
></spa-dialog-header>

<spa-dialog-content>
    <div class="grid max-h-[70vh] grid-cols-1 gap-6 overflow-y-auto pr-2 lg:grid-cols-[1fr_1.2fr]">
        <section class="flex flex-col gap-4">
            <form [formGroup]="form" class="flex flex-col gap-4">
                <spa-input
                    formControlName="name"
                    label="Option name"
                    [required]="true"
                    labelTooltip="name"
                    placeholder="Color"
                ></spa-input>

                <spa-select
                    formControlName="displayType"
                    label="Display type"
                    [options]="displayTypes"
                    [required]="true"
                    labelTooltip="displayType"
                ></spa-select>

                <spa-checkbox
                    formControlName="active"
                    label="Active"
                    labelTooltip="active"
                    styleClasses="boxed"
                ></spa-checkbox>
            </form>

            <div class="flex flex-col gap-3">
                @for (value of valuesSig(); track $index) {
                    <div class="grid grid-cols-[1fr_96px_auto] items-center gap-2">
                        <spa-input
                            [ngModel]="value.label"
                            (ngModelChange)="updateValue($index, { label: $event })"
                            [ngModelOptions]="{ standalone: true }"
                            label="Value"
                            labelTooltip="label"
                            placeholder="Red"
                        ></spa-input>
                        <spa-input
                            [ngModel]="value.swatchValue"
                            (ngModelChange)="updateValue($index, { swatchValue: $event })"
                            [ngModelOptions]="{ standalone: true }"
                            label="Swatch"
                            labelTooltip="swatchValue"
                            placeholder="#ff0000"
                        ></spa-input>
                        <button
                            mat-icon-button
                            type="button"
                            (click)="removeValue($index)"
                        >
                            <mat-icon>delete</mat-icon>
                        </button>
                    </div>
                }
                <button mat-stroked-button type="button" (click)="addValue()">
                    <mat-icon>add</mat-icon>
                    Add value
                </button>
            </div>

            <button
                mat-flat-button
                color="primary"
                type="button"
                (click)="saveOption()"
                [disabled]="isSavingSig()"
            >
                <mat-icon>save</mat-icon>
                Save option
            </button>
        </section>

        <section class="flex flex-col gap-3">
            @for (option of optionsSig(); track option.id) {
                <div class="rounded-lg border border-gray-200 bg-white p-4">
                    <div class="flex items-start justify-between gap-3">
                        <div>
                            <div class="text-sm font-semibold">{{ option.name }}</div>
                            <div class="text-secondary text-xs">
                                {{ option.code }} · {{ option.displayType }}
                            </div>
                        </div>
                        <button
                            mat-icon-button
                            type="button"
                            (click)="deleteOption(option)"
                        >
                            <mat-icon>delete</mat-icon>
                        </button>
                    </div>
                    <div class="mt-3 flex flex-wrap gap-2">
                        @for (value of option.values; track value.id) {
                            <span class="rounded border px-2 py-1 text-xs">
                                {{ value.label }}
                            </span>
                        }
                    </div>
                </div>
            } @empty {
                <div class="rounded-lg border border-dashed p-8 text-center text-sm text-gray-500">
                    No variant options yet.
                </div>
            }
        </section>
    </div>
</spa-dialog-content>

<spa-dialog-footer
    submitLabel="Done"
    (submitClicked)="close()"
    (cancelClicked)="close()"
></spa-dialog-footer>
