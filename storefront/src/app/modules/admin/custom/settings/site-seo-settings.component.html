<div [formGroup]="group" class="seo-settings space-y-5">
    <div
        class="rounded-[18px] border border-slate-200 bg-[linear-gradient(180deg,rgba(248,250,252,0.86),rgba(255,255,255,0.98))] p-4 shadow-[0_22px_50px_-42px_rgba(15,23,42,0.45)]"
    >
        <div
            class="flex flex-col gap-4 border-b border-slate-200 pb-4 md:flex-row md:items-start md:justify-between"
        >
            <h4 class="text-lg font-bold tracking-[-0.03em] text-slate-950">
                {{ 'admin.site.dashboard.seo.editorTitle' | transloco }}
            </h4>

            <div class="grid gap-2 text-right sm:grid-cols-2 sm:text-left">
                <div class="rounded-[14px] border border-slate-200 bg-white px-4 py-3">
                    <p
                        class="text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-400"
                    >
                        {{ 'admin.site.dashboard.seo.titleCounterLabel' | transloco }}
                    </p>
                    <p class="mt-1 text-sm font-semibold text-slate-900">
                        {{ titleLength }}/60
                    </p>
                </div>
                <div class="rounded-[14px] border border-slate-200 bg-white px-4 py-3">
                    <p
                        class="text-[11px] font-semibold uppercase tracking-[0.2em] text-slate-400"
                    >
                        {{ 'admin.site.dashboard.seo.descriptionCounterLabel' | transloco }}
                    </p>
                    <p class="mt-1 text-sm font-semibold text-slate-900">
                        {{ descriptionLength }}/160
                    </p>
                </div>
            </div>
        </div>

        <div class="mt-5 space-y-4 rounded-[16px] border border-slate-200 bg-white p-4">
            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                <spa-input
                    [label]="'admin.settings.seo.title' | transloco"
                    [placeholder]="
                        'admin.site.dashboard.seo.titlePlaceholder' | transloco
                    "
                    [styleClasses]="'seo-settings__field'"
                    formControlName="title"
                ></spa-input>
            </div>

            <spa-textarea
                [label]="'admin.settings.seo.description' | transloco"
                [placeholder]="
                    'admin.site.dashboard.seo.descriptionPlaceholder' | transloco
                "
                [rows]="4"
                [styleClasses]="'seo-settings__field'"
                formControlName="description"
            ></spa-textarea>

            <spa-input
                [label]="'admin.settings.seo.keywords' | transloco"
                [placeholder]="
                    'admin.site.dashboard.seo.keywordsPlaceholder' | transloco
                "
                [styleClasses]="'seo-settings__field'"
                formControlName="keywords"
            ></spa-input>
        </div>
    </div>
</div>
