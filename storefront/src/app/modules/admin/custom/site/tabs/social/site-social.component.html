<div class="mx-auto w-full max-w-5xl">
    <form [formGroup]="form" (ngSubmit)="save()" class="space-y-6">
        <div
            class="flex flex-col gap-4 rounded-[18px] border border-slate-200/80 bg-white/90 p-4 shadow-[0_24px_60px_-48px_rgba(15,23,42,0.48)] backdrop-blur sm:flex-row sm:items-center sm:justify-between sm:p-5"
        >
            <div class="flex items-center gap-3">
                <div
                    class="flex h-12 w-12 items-center justify-center rounded-[12px] bg-slate-100 text-slate-700 ring-1 ring-slate-200"
                >
                    <mat-icon
                        class="icon-size-5"
                        svgIcon="heroicons_outline:link"
                    ></mat-icon>
                </div>
                <div class="min-w-0">
                    <h3 class="text-lg font-bold tracking-[-0.03em] text-slate-950">
                        {{ 'admin.site.dashboard.social.title' | transloco }}
                    </h3>
                    <p class="text-sm text-slate-500">
                        {{
                            'admin.site.dashboard.social.description'
                                | transloco
                        }}
                    </p>
                </div>
            </div>

            <button
                mat-flat-button
                color="primary"
                type="submit"
                class="min-h-12 rounded-[12px] px-5"
                [disabled]="saving"
            >
                @if (saving) {
                    <mat-icon
                        class="mr-2 animate-spin"
                        svgIcon="heroicons_outline:arrow-path"
                    ></mat-icon>
                }
                {{ 'common.save' | transloco }}
            </button>
        </div>

        <section
            class="rounded-[18px] border border-slate-200/80 bg-white p-5 shadow-[0_28px_65px_-54px_rgba(15,23,42,0.55)] sm:p-6"
        >
            <div class="grid gap-4 md:grid-cols-2 xl:grid-cols-3">
                <div class="rounded-[14px] border border-slate-200 bg-slate-50/80 p-4">
                    <spa-input
                        [label]="'admin.site.dashboard.social.facebook' | transloco"
                        [labelTooltip]="'facebook'"
                        formControlName="facebook"
                        placeholder="https://facebook.com/..."
                        [showErrors]="true"
                    >
                    </spa-input>
                </div>

                <div class="rounded-[14px] border border-slate-200 bg-slate-50/80 p-4">
                    <spa-input
                        [label]="
                            'admin.site.dashboard.social.instagram'
                                | transloco
                        "
                        [labelTooltip]="'instagram'"
                        formControlName="instagram"
                        placeholder="https://instagram.com/..."
                        [showErrors]="true"
                    >
                    </spa-input>
                </div>

                <div class="rounded-[14px] border border-slate-200 bg-slate-50/80 p-4">
                    <spa-input
                        [label]="'admin.site.dashboard.social.x' | transloco"
                        [labelTooltip]="'x'"
                        formControlName="x"
                        placeholder="https://x.com/..."
                        [showErrors]="true"
                    >
                    </spa-input>
                </div>

                <div class="rounded-[14px] border border-slate-200 bg-slate-50/80 p-4">
                    <spa-input
                        [label]="
                            'admin.site.dashboard.social.linkedin'
                                | transloco
                        "
                        [labelTooltip]="'linkedin'"
                        formControlName="linkedin"
                        placeholder="https://linkedin.com/..."
                        [showErrors]="true"
                    >
                    </spa-input>
                </div>

                <div class="rounded-[14px] border border-slate-200 bg-slate-50/80 p-4">
                    <spa-input
                        [label]="
                            'admin.site.dashboard.social.youtube'
                                | transloco
                        "
                        [labelTooltip]="'youtube'"
                        formControlName="youtube"
                        placeholder="https://youtube.com/..."
                        [showErrors]="true"
                    >
                    </spa-input>
                </div>

                <div class="rounded-[14px] border border-slate-200 bg-slate-50/80 p-4">
                    <spa-input
                        [label]="
                            'admin.site.dashboard.social.tiktok'
                                | transloco
                        "
                        [labelTooltip]="'tiktok'"
                        formControlName="tiktok"
                        placeholder="https://tiktok.com/..."
                        [showErrors]="true"
                    >
                    </spa-input>
                </div>
            </div>
        </section>
    </form>
</div>
