<spa-dialog
    [title]="
        isCreateMode()
            ? ('admin.pageTemplates.dialog.create' | transloco)
            : ('admin.pageTemplates.dialog.edit' | transloco)
    "
    [size]="'xl'"
    [submitLabel]="
        isCreateMode()
            ? ('admin.common.create' | transloco)
            : ('admin.common.save' | transloco)
    "
    [submitDisabled]="form.invalid || isSystemTemplate()"
    [isSubmitting]="isSubmitting()"
    (closed)="cancel()"
    (cancelled)="cancel()"
    (submitted)="save()"
>
    <div class="flex flex-col gap-4">
        <form [formGroup]="form" class="flex flex-col gap-4">
            <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                <spa-input
                    [label]="'admin.common.fields.name' | transloco"
                    placeholder="Homepage Template"
                    formControlName="name"
                />

                <spa-input
                    [label]="'admin.common.fields.uid' | transloco"
                    placeholder="homepage-template"
                    formControlName="uid"
                    patternType="uid"
                    [readonly]="isEditMode()"
                />
            </div>

            <spa-textarea
                [label]="'admin.common.fields.description' | transloco"
                placeholder="Describe the template purpose"
                formControlName="description"
                [rows]="2"
            />

            <spa-toggle
                [label]="'admin.common.fields.active' | transloco"
                formControlName="isActive"
            />
        </form>

        <div class="mt-6 border-t pt-4">
            <div class="mb-4 flex items-center justify-between">
                <h3 class="text-lg font-medium">
                    {{ 'admin.pageTemplates.slots.title' | transloco }}
                </h3>
                <button
                    mat-stroked-button
                    type="button"
                    (click)="addSlot()"
                    [disabled]="isSubmitting() || isSystemTemplate()"
                >
                    <mat-icon class="mr-2 icon-size-5">add</mat-icon>
                    {{ 'admin.pageTemplates.slots.add' | transloco }}
                </button>
            </div>

            @if (slotsSig().length > 0) {
                <spa-reorder-list
                    [items]="slotsSig()"
                    [disabled]="isSubmitting() || isSystemTemplate()"
                    (reorder)="onSlotsReorder($event)"
                >
                    <ng-template #itemTemplate let-slot let-i="index">
                        <div
                            class="grid flex-1 grid-cols-1 gap-4 sm:grid-cols-2"
                        >
                            <spa-select
                                [label]="
                                    'admin.pageTemplates.slots.columns.name'
                                        | transloco
                                "
                                [value]="slot.slotName"
                                (changed)="updateSlotName(i, $event)"
                                [options]="availableSlotsSig()"
                                [placeholder]="'Select Slot'"
                            />

                            <spa-select
                                [label]="
                                    'admin.pageTemplates.slots.columns.position'
                                        | transloco
                                "
                                [value]="slot.position"
                                (changed)="updateSlotPosition(i, $event)"
                                [options]="slotPositionOptions"
                            />
                        </div>

                        <button
                            mat-icon-button
                            color="warn"
                            type="button"
                            (click)="removeSlot(i)"
                            [disabled]="isSubmitting() || isSystemTemplate()"
                        >
                            <mat-icon
                                svgIcon="heroicons_outline:trash"
                            ></mat-icon>
                        </button>
                    </ng-template>
                </spa-reorder-list>
            } @else {
                <div
                    class="text-secondary flex flex-col items-center justify-center rounded-lg border border-dashed bg-gray-50 py-8 dark:bg-transparent"
                >
                    <mat-icon
                        class="mb-2 icon-size-8"
                        svgIcon="heroicons_outline:squares-plus"
                    ></mat-icon>
                    <div class="text-sm font-medium">
                        {{ 'admin.pageTemplates.slots.empty' | transloco }}
                    </div>
                </div>
            }
        </div>
    </div>
</spa-dialog>
