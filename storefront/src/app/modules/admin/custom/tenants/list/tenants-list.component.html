<div
    class="bg-card flex min-w-0 flex-auto flex-col overflow-hidden sm:absolute sm:inset-0 dark:bg-transparent"
>
    <admin-page-header
        [title]="'admin.tenants.title' | transloco"
        [showCreateButton]="true"
        [createButtonText]="'admin.tenants.create' | transloco"
        (createClick)="createTenant()"
        [showSearch]="true"
        [searchPlaceholder]="'admin.tenants.searchPlaceholder' | transloco"
        (search)="onSearchInput($event)"
        [isLoading]="store.isLoading()"
    >
        <ng-container actions>
            <spa-admin-sort-dropdown
                [availableSorts]="store.sortConfig()?.availableSorts || []"
                [sortCode]="sortCodeSig()"
                (sortChange)="onSortChange($event)"
            >
            </spa-admin-sort-dropdown>
        </ng-container>
    </admin-page-header>

    <div class="flex flex-auto flex-col overflow-hidden">
        <div class="flex flex-auto flex-col overflow-y-auto">
            <spa-admin-grid
                [items]="store.items()"
                [columns]="columnsSig()"
                [actions]="actionsSig()"
                [isLoading]="store.isLoading()"
                [emptyTitle]="'admin.tenants.grid.noData' | transloco"
                [actionsTemplate]="actionsTemplate"
                (rowClick)="viewTenantDetail($event)"
            >
            </spa-admin-grid>
        </div>

        @if (store.totalElements() > 0) {
            <spa-admin-paginator
                class="z-10 flex-none"
                [pageIndex]="pageIndexSig()"
                [pageSize]="pageSizeSig()"
                [length]="store.totalElements()"
                (pageCallback)="onPageChange($event)"
            >
            </spa-admin-paginator>
        }
    </div>
</div>

<ng-template #infoTemplate let-tenant>
    <div class="flex min-w-0 flex-col gap-1">
        <div class="flex items-center gap-3">
            <h3 class="truncate text-base font-semibold leading-none">
                {{ tenant.companyName }}
            </h3>
            <span class="sm:hidden">
                <spa-status-badge
                    [status]="tenant.status"
                    size="sm"
                ></spa-status-badge>
            </span>
        </div>
        <div class="text-secondary flex items-center gap-2 text-sm">
            <span class="truncate">{{ tenant.subdomain }}</span>
        </div>
    </div>
</ng-template>

<ng-template #actionsTemplate let-tenant>
    <button
        mat-icon-button
        [matTooltip]="'admin.provisioning.manualProvision' | transloco"
        (click)="$event.stopPropagation(); provisionTenant(tenant)"
    >
        <mat-icon svgIcon="heroicons_outline:server-stack"></mat-icon>
    </button>

    <button
        mat-icon-button
        [matTooltip]="'admin.tenants.actions.syncMigrations' | transloco"
        [disabled]="tenant.status !== 'ACTIVE'"
        (click)="$event.stopPropagation(); syncMigrations(tenant)"
    >
        <mat-icon svgIcon="heroicons_outline:arrow-path"></mat-icon>
    </button>

    <button
        mat-icon-button
        [matTooltip]="
            tenant.hasAdminUser
                ? ('admin.tenants.actions.adminExists' | transloco)
                : ('admin.tenants.actions.generateAdmin' | transloco)
        "
        [disabled]="tenant.hasAdminUser || tenant.status !== 'ACTIVE'"
        (click)="$event.stopPropagation(); generateAdminUser(tenant)"
    >
        <mat-icon
            [svgIcon]="
                tenant.hasAdminUser
                    ? 'heroicons_outline:check-circle'
                    : 'heroicons_outline:user-plus'
            "
        ></mat-icon>
    </button>

    <button
        mat-icon-button
        [matTooltip]="'admin.common.actions.edit' | transloco"
        (click)="$event.stopPropagation(); editTenant(tenant)"
    >
        <mat-icon svgIcon="heroicons_outline:pencil-square"></mat-icon>
    </button>
</ng-template>
