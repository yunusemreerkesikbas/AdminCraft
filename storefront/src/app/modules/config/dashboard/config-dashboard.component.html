<div class="flex flex-auto flex-col overflow-hidden bg-gray-100 dark:bg-gray-900">

    <!-- Header -->
    <header class="flex items-center justify-between bg-gray-900 px-6 py-3 shadow dark:bg-gray-950">
        <div class="flex items-center gap-2">
            <mat-icon
                svgIcon="heroicons_outline:adjustments-horizontal"
                class="text-white opacity-80"
                style="width: 1.15rem; height: 1.15rem; font-size: 1.15rem;"
            />
            <span class="text-sm font-semibold text-white">{{ titleSig() }}</span>
        </div>

        <div class="flex items-center gap-4">
            <span class="text-xs text-gray-400">{{ token().email }}</span>
            <button
                mat-stroked-button
                (click)="logout.emit()"
                class="!h-7 !min-h-0 !text-xs !text-white hover:!bg-white/10"
            >
                Sign out
            </button>
        </div>
    </header>

    <!-- Content -->
    <main class="flex-auto overflow-y-auto">
        <div class="mx-auto w-full max-w-5xl px-6 py-6">
            <spa-config-properties [token]="token()" />
        </div>
    </main>

</div>
