<div
    class="spa-otp-input w-full"
    [class.spa-otp-input--disabled]="isDisabled()"
>
    @if (label) {
        <label class="spa-otp-input__label">{{ label }}</label>
    }

    <div
        class="spa-otp-input__boxes"
        role="group"
        [attr.aria-label]="label || 'Verification code'"
    >
        @for (index of indices; track index) {
            <input
                #digitInput
                class="spa-otp-input__box"
                type="text"
                inputmode="numeric"
                autocomplete="one-time-code"
                maxlength="1"
                [value]="digitsSig()[index]"
                [disabled]="isDisabled()"
                [attr.aria-label]="'Digit ' + (index + 1)"
                (input)="onDigitInput($event, index)"
                (keydown)="onKeydown($event, index)"
                (paste)="onPaste($event)"
                (focus)="onFocus()"
            />
        }
    </div>
</div>
