<mat-radio-group
    [disabled]="disabled"
    [value]="value"
    [class]="styleClasses"
    (change)="onSelection($event.value)"
>
    @for (o of options; track o.value) {
        <mat-radio-button
            [value]="o.value"
            [disabled]="o.disabled"
            class="mr-4"
        >
            {{ o.label || (o.labelKey | transloco) }}
        </mat-radio-button>
    }
</mat-radio-group>
