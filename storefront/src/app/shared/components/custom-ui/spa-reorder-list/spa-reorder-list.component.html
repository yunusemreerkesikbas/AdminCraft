<div
    class="flex flex-col gap-y-1"
    cdkDropList
    [cdkDropListData]="items"
    [cdkDropListDisabled]="disabled"
    (cdkDropListDropped)="onDrop($event)"
>
    @for (item of items; track $index; let i = $index) {
        <div
            class="border-default group text-default bg-card relative flex transform-gpu items-center gap-x-2 rounded-lg border px-3 py-1.5 shadow-sm transition-all duration-200 hover:bg-hover"
            [ngClass]="{
                'opacity-50': disabled,
            }"
            cdkDrag
            [cdkDragDisabled]="disabled"
        >
            <!-- Drag Handle -->
            <div
                class="text-secondary flex cursor-grab items-center justify-center transition-colors hover:scale-110 active:cursor-grabbing group-hover:text-primary"
                cdkDragHandle
            >
                <mat-icon
                    svgIcon="heroicons_outline:bars-2"
                    class="icon-size-4"
                ></mat-icon>
            </div>

            <!-- Item Content -->
            <div class="flex min-w-0 flex-1">
                @if (itemTemplate) {
                    <ng-container
                        [ngTemplateOutlet]="itemTemplate"
                        [ngTemplateOutletContext]="{
                            $implicit: item,
                            index: i,
                        }"
                    ></ng-container>
                } @else {
                    <span class="text-sm font-medium">{{ item }}</span>
                }
            </div>

            <!-- Drag Placeholder -->
            <div
                class="rounded-lg border-2 border-dashed border-primary/20 bg-primary/5"
                *cdkDragPlaceholder
            ></div>

            <!-- Drag Preview -->
            <div
                class="text-default bg-card flex items-center gap-x-2 rounded-lg border border-primary/50 px-3 py-1.5 shadow-xl"
                *cdkDragPreview
            >
                <div class="flex items-center justify-center text-primary">
                    <mat-icon
                        svgIcon="heroicons_outline:bars-2"
                        class="icon-size-4"
                    ></mat-icon>
                </div>
                <div class="flex min-w-0 flex-1">
                    @if (itemTemplate) {
                        <ng-container
                            [ngTemplateOutlet]="itemTemplate"
                            [ngTemplateOutletContext]="{
                                $implicit: item,
                                index: i,
                            }"
                        ></ng-container>
                    } @else {
                        <span class="text-sm font-medium">{{ item }}</span>
                    }
                </div>
            </div>
        </div>
    }
</div>
