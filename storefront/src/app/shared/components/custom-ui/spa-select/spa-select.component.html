<mat-form-field
    class="w-full"
    [class]="styleClasses"
    [subscriptSizing]="'dynamic'"
    [floatLabel]="'always'"
>
    @if (label) {
        <mat-label [matTooltip]="labelTooltip || ''">{{ label }}</mat-label>
    }
    <mat-select
        [disabled]="disabled || readonly"
        [value]="value"
        [multiple]="multiple"
        [placeholder]="placeholder || ''"
        (selectionChange)="onSelectionChange($event.value)"
        (closed)="touched()"
    >
        @if (placeholder) {
            <mat-option [value]="null">{{ placeholder }}</mat-option>
        }
        @if (options && options.length) {
            @for (o of options; track o) {
                <mat-option
                    [value]="optionValue ? o[optionValue] : o.value"
                    [disabled]="o.disabled"
                >
                    {{
                        optionLabel
                            ? o[optionLabel]
                            : o.label || (o.labelKey | transloco)
                    }}
                </mat-option>
            }
        }
    </mat-select>
    @if (hint) {
        <mat-hint>{{ hint }}</mat-hint>
    }
</mat-form-field>
