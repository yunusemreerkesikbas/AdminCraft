<!doctype html>
<html lang="en">
    <head>
        <title>Craftive Admin</title>
        <meta charset="utf-8" />
        <meta
            name="description"
            content="Modular project solutions tailored to customer needs. Craftive admin runs your content, catalog, and tenant operations on a tenant-isolated, headless-ready, reusable platform foundation."
        />
        <meta
            name="keywords"
            content="Craftive, modular project solutions, multi-tenant, tenant isolation, headless CMS, content management, product catalog, reusable platform, customizable, admin console, CMS operations"
        />
        <meta name="application-name" content="Craftive" />
        <meta
            name="viewport"
            content="width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0"
        />

        <base href="/" />

        <!-- Favicon -->
        <link rel="icon" type="image/svg+xml" href="favicon.svg" />

        <!-- Fonts -->
        <link href="https://fonts.gstatic.com" rel="preconnect" />
        <link
            href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
            rel="stylesheet"
        />

        <!-- Icon fonts -->
        <link
            href="https://fonts.googleapis.com/icon?family=Material+Icons"
            rel="stylesheet"
        />
    </head>

    <body>
        <!-- Splash screen -->
        <fuse-splash-screen>
            <img
                class="mx-auto h-10 w-auto max-w-[min(90vw,14rem)] object-contain"
                src="images/logo/logo.svg"
                alt="Craftive logo"
            />
            <div class="spinner">
                <div class="bounce1"></div>
                <div class="bounce2"></div>
                <div class="bounce3"></div>
            </div>
        </fuse-splash-screen>

        <!-- App root -->
        <app-root></app-root>
    </body>
</html>
